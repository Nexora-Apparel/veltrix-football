name: Historical Model Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veltrix-historical-model-backtest
  cancel-in-progress: false

jobs:
  backtest:
    # DISABLED: legacy prediction/backtest modules are excluded from VELTRIX 2.0.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Import historical dataset
        run: python scripts/import_open_dataset.py --from 2000-01-01 --to "$(date -u +%F)" --output data/open_historical_matches.csv
      - name: Audit exact backtest dataset
        run: >-
          python scripts/audit_historical_csv.py
          --input data/open_historical_matches.csv
          --json-output reports/historical_coverage_audit.json
          --markdown-output reports/historical_coverage_audit.md
      - name: Run chronological model comparison
        run: python scripts/run_backtest.py --input data/open_historical_matches.csv --output reports/backtest_summary.json
      - name: Publish reproducible model-validation evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .
        run: |
          python scripts/publish_model_validation.py \
            --backtest reports/backtest_summary.json \
            --coverage reports/historical_coverage_audit.json \
            --output reports/model_validation_report.json
      - name: Upload backtest report
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-backtest-report
          path: |
            reports/backtest_summary.json
            reports/model_validation_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload backtest dataset coverage audit
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-backtest-coverage-audit
          path: |
            reports/historical_coverage_audit.json
            reports/historical_coverage_audit.md
          if-no-files-found: error
          retention-days: 90
