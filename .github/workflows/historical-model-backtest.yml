name: Historical Model Backtest

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Historical Dataset Import"]
    types: [completed]

permissions:
  contents: read

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Import recent historical dataset
        run: python scripts/import_open_dataset.py --from 2000-01-01 --to "$(date -u +%F)" --output data/open_historical_matches.csv
      - name: Run chronological model comparison
        run: python scripts/run_backtest.py --input data/open_historical_matches.csv --output reports/backtest_summary.json
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-backtest-report
          path: reports/backtest_summary.json
          retention-days: 30
