name: Historical Model Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * 1"
  push:
    branches: [main]
    paths:
      - "app/backtest_engine.py"
      - "scripts/run_backtest.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/historical-model-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Import historical dataset
        run: python scripts/import_open_dataset.py --from 2000-01-01 --to "$(date -u +%F)" --output data/open_historical_matches.csv
      - name: Run chronological model comparison
        run: python scripts/run_backtest.py --input data/open_historical_matches.csv --output reports/backtest_summary.json
      - name: Upload backtest report
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-backtest-report
          path: reports/backtest_summary.json
          if-no-files-found: error
          retention-days: 30
