name: Historical Results Gap Backfill
# One-shot ODbL recovery pass over the expanded 2026 European competition catalogue.

on:
  schedule:
    # Retry unresolved history 30 minutes after the 06:00 WAT report target.
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/backfill_history_gaps.py"
      - ".github/workflows/historical-gap-backfill.yml"
  workflow_dispatch:
    inputs:
      from:
        description: "First unresolved date (YYYY-MM-DD); blank uses the cache gap list"
        required: false
        type: string
      to:
        description: "Last unresolved date (YYYY-MM-DD); blank uses the cache gap list"
        required: false
        type: string
      force:
        description: "Bypass the one-day retry cooldown for this explicit recovery run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: veltrix-historical-gap-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-gap-backfill]') || contains(github.event.head_commit.message, '[run-openligadb-backfill]')
    runs-on: ubuntu-latest
    concurrency:
      group: veltrix-5dollar-provider
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch latest published results cache
        uses: actions/checkout@v7
        with:
          ref: command-data
          path: command-data
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: public-data/recent_results_cache.json
          sparse-checkout-cone-mode: false
      - name: Disable non-commercial fallback data sources
        run: |
          mkdir -p reports
          printf 'source,division,match_date,home_team,away_team,home_goals,away_goals,full_time_result\\n' > reports/gap_fallback.csv
      - name: Retry unresolved dates, merge sourced results, and publish cache
        id: backfill
        env:
          FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .
          VELTRIX_HISTORY_REQUEST_DELAY_SECONDS: "10"
        run: |
          python scripts/backfill_history_gaps.py \
            --cache command-data/public-data/recent_results_cache.json \
            --fallback reports/gap_fallback.csv \
            --output reports/recent_results_cache.json \
            --report reports/historical_gap_backfill.json \
            ${{ (inputs.force == true || contains(github.event.head_commit.message, '[run-gap-backfill]')) && '--force' || '' }}
      - name: Upload gap-backfill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-historical-gap-backfill
          path: |
            reports/historical_gap_backfill.json
            reports/recent_results_cache.json
            reports/gap_fallback.csv
          if-no-files-found: warn
          retention-days: 90
