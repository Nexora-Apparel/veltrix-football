name: VELTRIX FOOTBALL V2 CI

on:
  push:
    branches:
      - "v2/**"
    paths:
      - "veltrix_v2/**"
      - "tests/v2/**"
      - ".github/workflows/v2-ci.yml"
      - "pyproject.toml"
      - "requirements*.txt"
  pull_request:
    branches:
      - main
      - "v2/**"
    paths:
      - "veltrix_v2/**"
      - "tests/v2/**"
      - ".github/workflows/v2-ci.yml"
      - "pyproject.toml"
      - "requirements*.txt"

# Superseded runs are cancelled so repeated pushes do not consume runner minutes.
concurrency:
  group: v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run V2 domain tests
        run: python -m pytest -q tests/v2
