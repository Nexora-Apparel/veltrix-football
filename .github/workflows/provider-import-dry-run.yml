name: Provider-backed Import Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3/strikerapi-readonly-qualification
    paths:
      - scripts/provider_import_dry_run.py
      - .github/workflows/provider-import-dry-run.yml

permissions:
  contents: read

concurrency:
  group: veltrix-provider-import-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
      DRY_RUN_DATABASE_URL: ${{ secrets.DRY_RUN_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/strikerapi-readonly-qualification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate isolated database target
        run: |
          if [ -z "$DRY_RUN_DATABASE_URL" ]; then
            echo "::error::DRY_RUN_DATABASE_URL secret is required."
            exit 2
          fi
          if [ -z "$STRIKERAPI_API_KEY" ] || [ -z "$FIVEDOLLARFOOTBALL_API_KEY" ]; then
            echo "::error::STRIKERAPI_API_KEY and FIVEDOLLARFOOTBALL_API_KEY secrets are required."
            exit 2
          fi
      - name: Run provider-backed dry-run
        run: python scripts/provider_import_dry_run.py > provider_import_dry_run.json
      - name: Upload sanitized dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-provider-import-dry-run
          path: provider_import_dry_run.json
          if-no-files-found: error
          retention-days: 7
