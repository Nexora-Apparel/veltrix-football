name: Verify Multi-Source Football Providers

# Live provider requests are manual-only. Push/PR validation belongs in the
# secret-free test workflow and must never consume provider quota.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke-check:
    runs-on: ubuntu-latest
    concurrency:
      group: veltrix-5dollar-provider
      cancel-in-progress: false
    timeout-minutes: 5
    env:
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify provider authentication and access
        run: python scripts/verify_data_providers.py
