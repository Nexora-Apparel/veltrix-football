name: Verify Multi-Source Football Providers

on:
  workflow_dispatch:
    inputs:
      probe_odds_markets:
        description: "Probe one upcoming BTTS quote per top-five, Argentina and Brazil league (up to 8 Odds API credits)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  provider-smoke-check:
    runs-on: ubuntu-latest
    concurrency:
      group: veltrix-5dollar-provider
      cancel-in-progress: false
    timeout-minutes: 5
    env:
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
      FIVEDOLLAR_REQUIRED_PLAN: community
      FIVEDOLLAR_MIN_ACCESSIBLE_LEAGUES: "6"
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PROBE_THE_ODDS_API_MARKETS: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_odds_markets || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify provider authentication and access
        run: python scripts/verify_data_providers.py
