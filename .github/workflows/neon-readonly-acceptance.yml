name: Neon Read-only Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify DATABASE_URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not configured."
            exit 2
          fi
      - name: Run read-only Neon acceptance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/neon_acceptance.py
