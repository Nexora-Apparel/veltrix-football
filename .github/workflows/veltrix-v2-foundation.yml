      - name: Test V2 Telegram command renderer isolation
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_telegram_commands.py
      - name: Test V2 Telegram duplicate and uncertain-delivery guards
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_telegram_v2_delivery.py
      - name: Test legacy Telegram sender shutdown
        run: python -m pytest --import-mode=importlib -q tests/test_telegram_report.py
