      - "docs/VELTRIX_V2_AIMIDAS_DATASET_AUDIT_2026-11-15.md"
      - "docs/VELTRIX_V2_STAGE2_MASTER_EXECUTION_LEDGER.md"
      - "scripts/send_telegram_report.py"
      - "scripts/publish_command_data.py"
      - "tests/test_publish_command_data.py"
      - "tests/test_telegram_report.py"
      - "tests/providers/odds_api_v4/**"
      - "tests/providers/test_fivedollar_odds_history.py"
      - "tests/providers/test_fivedollar_opening_odds.py"
      - "tests/scripts/test_phase2_capture_fivedollar_opening_odds.py"
      - "scripts/phase2_capture_fivedollar_opening_odds.py"
      - ".github/workflows/phase2-5dollar-opening-odds-capture.yml"
      - "tests/providers/test_openfootball_archive.py"
      - "tests/scripts/test_export_openfootball_archive.py"
      - "scripts/veltrix_v2/**"
      - ".github/workflows/veltrix-v2-foundation.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "veltrix_v2/**"
      - "scripts/veltrix_v2/**"
      - "scripts/send_telegram_report.py"
      - "scripts/publish_command_data.py"
      - "tests/test_publish_command_data.py"
      - "tests/test_telegram_report.py"
      - "tests/veltrix_v2/**"
      - "tests/test_v2_advanced_estimators.py"
      - "tests/test_v2_challenger_advanced.py"
      - "tests/providers/odds_api_v4/**"
      - "tests/providers/test_fivedollar_odds_history.py"
      - "db/migrations/0005_provider_credit_reservation_ledger.sql"
      - "db/migrations/0006_provider_quota_evidence.sql"
      - "db/migrations/0007_provider_capture_state_events.sql"
