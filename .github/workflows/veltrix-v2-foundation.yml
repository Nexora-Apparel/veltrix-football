      - "tests/test_v2_challenger_advanced.py"
      - "scripts/phase5_staging_coverage_audit.py"
      - "scripts/phase5_collect_5dollar_shadow.py"
      - "scripts/phase2_capture_fivedollar_opening_odds.py"
      - "tests/scripts/test_phase2_capture_fivedollar_opening_odds.py"
      - ".github/workflows/phase2-5dollar-opening-odds-capture.yml"
      - "db/migrations/0008_prospective_paper_ledger.sql"
      - "db/migrations/0012_prediction_feature_snapshot_links.sql"
      - "scripts/phase5_prediction_feature_link_migration.py"
      - "tests/test_phase5_prediction_feature_link_migration.py"
      - "veltrix_v2/ledger/postgres_store.py"
      - "tests/veltrix_v2/test_paper_ledger_postgres.py"
