      - "tests/veltrix_v2/test_crosswalk_bootstrap.py"
      - "docs/VELTRIX_V2_STAGING_COVERAGE_AUDIT_CLI_2026-11-14.md"
      - "docs/VELTRIX_V2_MANUAL_5DOLLAR_SHADOW_CAPTURE_2026-11-14.md"
      - "docs/VELTRIX_V2_PROSPECTIVE_FIRST_OBSERVED_SHADOW_EVIDENCE_2026-11-14.md"
