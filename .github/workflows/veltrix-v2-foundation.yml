name: VELTRIX 2.0 Foundation Tests
# StatsBomb event adapter contract coverage included.

on:
  pull_request:
    paths:
      - "veltrix_v2/**"
      - "tests/veltrix_v2/**"
      - ".github/workflows/veltrix-v2-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest
      - name: Test independent v2 contracts
        run: python -m pytest -q tests/veltrix_v2
      - name: Enforce no legacy prediction imports in v2
        run: |
          if grep -R -n -E "from app\.(live_predictions|prediction|advanced_models|calibration|backtest_engine)|import app\.(live_predictions|prediction|advanced_models|calibration|backtest_engine)" veltrix_v2; then
            echo "Legacy prediction dependency found in veltrix_v2."
            exit 1
          fi
