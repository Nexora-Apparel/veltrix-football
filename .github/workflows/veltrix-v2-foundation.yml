          if grep -R -n -E "from app\.(live_predictions|prediction|advanced_models|calibration|backtest_engine)|import app\.(live_predictions|prediction|advanced_models|calibration|backtest_engine)" veltrix_v2; then
            echo "Legacy prediction dependency found in veltrix_v2."
            exit 1
          fi

  reservation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrix_reservation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_reservation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veltrix_reservation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install --upgrade pip && pip install pytest "psycopg[binary]"
      - name: Test credit reservation migration and concurrency
        run: python -m pytest --import-mode=importlib -q tests/providers/odds_api_v4/test_reservation_postgres.py tests/providers/odds_api_v4/test_quota_evidence_postgres.py tests/providers/odds_api_v4/test_capture_state_postgres.py tests/providers/odds_api_v4/test_capture_request_postgres.py
      - name: Test append-only provider evidence persistence
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_evidence_persistence_postgres.py
      - name: Test complete PostgreSQL migration chain
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_full_migration_chain_postgres.py
      - name: Test append-only PostgreSQL paper ledger persistence
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_paper_ledger_postgres.py
      - name: Test durable Telegram delivery claims
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_telegram_delivery_postgres.py
      - name: Test append-only Telegram delivery reconciliation
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_telegram_reconciliation_postgres.py


  aimidas-brazil-serie-b-identity:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/v2-report-bundle-wiring-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Compile and test Brazil Serie B identity audit
        run: |
          python -m compileall -q scripts/veltrix_v2/reconcile_aimidas_brazil_serie_b_2026.py
          python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_aimidas_brazil_serie_b_2026.py tests/veltrix_v2/test_aimidas_snapshot.py tests/veltrix_v2/test_aimidas_staging_import.py
      - name: Fetch exact pinned AI Midas source snapshot
        run: python scripts/veltrix_v2/collect_aimidas_snapshot.py --output-dir /tmp/veltrix-aimidas-pack
      - name: Independently verify source snapshot
        run: python scripts/veltrix_v2/verify_aimidas_snapshot.py --input-dir /tmp/veltrix-aimidas-pack
      - name: Reconcile all 369 matches against staging (read-only)
        run: |
          python scripts/veltrix_v2/reconcile_aimidas_brazil_serie_b_2026.py \
            --input-dir /tmp/veltrix-aimidas-pack \
            --output /tmp/aimidas-brazil-serie-b-identity-detail.json \
            --summary-output reports/aimidas/brazil-serie-b-2026-identity-audit.json
      - name: Upload sanitized audit evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-aimidas-brazil-serie-b-2026-identity-audit
          path: reports/aimidas/brazil-serie-b-2026-identity-audit.json
          if-no-files-found: warn
          retention-days: 30


  odds-api-no-credit-preflight:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-veltrix-odds-api-quota-check' && github.event.pull_request.head.ref == 'integration/v2-report-bundle-wiring-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install no-credit probe dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Verify Brazil Serie B sport entitlement and current quota without odds credits
        run: python -m scripts.veltrix_v2.probe_odds_api_no_credit


  odds-api-approved-league-price-pilot:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-veltrix-odds-api-approved-league-price-pilot' && github.event.pull_request.head.ref == 'integration/v2-report-bundle-wiring-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install historical odds capture dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Compile and test approved-league historical odds capture
        run: |
          python -m compileall -q scripts/veltrix_v2/capture_odds_api_historical_price_pilot.py
          python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_odds_api_historical_price_pilot.py
      - name: Capture one approved La Liga historical 1X2 sample (maximum 12 credits; staging only)
        run: python -m scripts.veltrix_v2.capture_odds_api_historical_price_pilot --output /tmp/veltrix-odds-api-historical-price-pilot.json
      - name: Upload sanitized capture manifest (no odds prices)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-odds-api-approved-la-liga-price-pilot
          path: /tmp/veltrix-odds-api-historical-price-pilot.json
          if-no-files-found: warn
          retention-days: 30
