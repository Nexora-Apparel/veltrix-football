name: VELTRIX 2.0 Phase 2 Data Foundation Tests
# Historical source rights, fixture parsing, provenance and ingestion contracts only.
# Includes clean-room model-core tests; full predictive evaluation remains a separate gate.

on:
  push:
    branches:
      - veltrix-2.0-architecture-blueprint
    paths:
      - "veltrix_v2/**"
      - "tests/veltrix_v2/**"
      - "scripts/veltrix_v2/**"
      - "tests/providers/odds_api_v4/**"
      - "tests/providers/test_openfootball_archive.py"
      - "tests/scripts/test_export_openfootball_archive.py"
      - "scripts/veltrix_v2/**"
      - ".github/workflows/veltrix-v2-foundation.yml"
  pull_request:
    paths:
      - "veltrix_v2/**"
      - "tests/veltrix_v2/**"
      - "tests/providers/odds_api_v4/**"
      - "db/migrations/0005_provider_credit_reservation_ledger.sql"
      - "db/migrations/0006_provider_quota_evidence.sql"
      - "db/migrations/0007_provider_capture_state_events.sql"
      - "tests/test_phase2_data_foundation.py"
      - "scripts/phase2_fivedollar_history_dry_run.py"
      - "scripts/phase3_import_fivedollar_history.py"
      - "scripts/phase3_audit_staging_import.py"
      - ".github/workflows/veltrix-v2-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest
      - name: Compile Phase 2 data foundation
        run: python -m compileall -q veltrix_v2 scripts/phase2_fivedollar_history_dry_run.py scripts/phase3_import_fivedollar_history.py scripts/phase3_audit_staging_import.py
      - name: Test Phase 2 data contracts
        run: python -m pytest --import-mode=importlib -q tests/test_phase2_data_foundation.py
      - name: Test offline Odds API parser and budget planner
        run: python -m pytest --import-mode=importlib -q tests/providers/odds_api_v4 --ignore=tests/providers/odds_api_v4/test_reservation_postgres.py --ignore=tests/providers/odds_api_v4/test_quota_evidence_postgres.py --ignore=tests/providers/odds_api_v4/test_capture_state_postgres.py --ignore=tests/providers/odds_api_v4/test_capture_request_postgres.py
      - name: Test provider-neutral free-first access policy
        run: python -m pytest --import-mode=importlib -q tests/providers/test_provider_access.py
      - name: Test independent results-only Poisson model
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_results_only_poisson.py
      - name: Test point-in-time Elo rating features
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_elo.py
      - name: Test point-in-time team form features
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_form.py
      - name: Test chronological Elo challenger evaluation
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_elo_challenger.py
      - name: Test chronological team form and shared-sample challengers
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_model_challengers_and_paper_ledger.py
      - name: Test rights-gated prospective paper forecast admission
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_paper_admission.py
      - name: Test rights-verified paper settlements
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_paper_settlement.py
      - name: Test deterministic batch prediction engine
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_prediction_engine.py
      - name: Test evidence-backed team identity crosswalk
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_team_identity.py
      - name: Test provider-to-model observation adapter
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_observation_adapter.py
      - name: Test immutable provider evidence capture
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_provider_evidence_capture.py
      - name: Test multi-provider coverage and dispatch policy
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_provider_registry.py
      - name: Test certified multi-provider observation merge
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_provider_observation_merge.py
      - name: Test guarded staging evidence persistence
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_evidence_persistence.py
      - name: Test StrikerAPI dataset freshness evidence
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_strikerapi_freshness.py
      - name: Test free-first 5Dollar forecast orchestration
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_fivedollar_engine.py
      - name: Test bounded 5Dollar forecast dry run
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_fivedollar_forecast_dry_run.py
      - name: Test OpenFootball archive parser
        run: python -m pytest --import-mode=importlib -q tests/providers/test_openfootball_archive.py
      - name: Test OpenFootball archive export script
        run: python -m pytest --import-mode=importlib -q tests/scripts/test_export_openfootball_archive.py
      - name: Test chronological and date-only walk-forward evaluation
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_walk_forward.py
      - name: Test calibration and date-clustered uncertainty
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_reliability.py
      - name: Enforce no legacy prediction imports in v2
        run: |
          if grep -R -n -E "from app\.(live_predictions|prediction|advanced_models|calibration|backtest_engine)|import app\.(live_predictions|prediction|advanced_models|calibration|backtest_engine)" veltrix_v2; then
            echo "Legacy prediction dependency found in veltrix_v2."
            exit 1
          fi

  reservation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrix_reservation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_reservation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veltrix_reservation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install --upgrade pip && pip install pytest "psycopg[binary]"
      - name: Test credit reservation migration and concurrency
        run: python -m pytest --import-mode=importlib -q tests/providers/odds_api_v4/test_reservation_postgres.py tests/providers/odds_api_v4/test_quota_evidence_postgres.py tests/providers/odds_api_v4/test_capture_state_postgres.py tests/providers/odds_api_v4/test_capture_request_postgres.py
      - name: Test append-only provider evidence persistence
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_evidence_persistence_postgres.py
