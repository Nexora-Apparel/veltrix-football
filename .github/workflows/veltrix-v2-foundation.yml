permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Phase 2 data foundation
        run: python -m compileall -q veltrix_v2 scripts/phase2_fivedollar_history_dry_run.py scripts/phase3_import_fivedollar_history.py scripts/phase3_audit_staging_import.py scripts/phase4_odds_account_probe.py scripts/phase2_capture_fivedollar_opening_odds.py scripts/phase5_capture_odds_api_quota.py scripts/veltrix_v2/collect_openfootball_pit_snapshots.py
      - name: Validate V2 dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import re
          source = pathlib.Path("api/telegram.py").read_text(encoding="utf-8")
          module = ast.parse(source, filename="api/telegram.py")
          dashboard = None
          for node in ast.walk(module):
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "DASHBOARD_HTML"
                  for target in node.targets
              ):
                  dashboard = ast.literal_eval(node.value)
                  break
          if not isinstance(dashboard, str):
              raise SystemExit("DASHBOARD_HTML literal assignment not found")
          scripts = re.findall(r"<script>(.*?)</script>", dashboard, re.S)
          if not scripts:
              raise SystemExit("No embedded dashboard JavaScript found")
          pathlib.Path("/tmp/veltrix-v2-dashboard.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/veltrix-v2-dashboard.js
      - name: Test Phase 2 data contracts
        run: python -m pytest --import-mode=importlib -q tests/test_phase2_data_foundation.py
      - name: Test offline Odds API parser and budget planner
        run: python -m pytest --import-mode=importlib -q tests/providers/odds_api_v4 --ignore=tests/providers/odds_api_v4/test_reservation_postgres.py --ignore=tests/providers/odds_api_v4/test_quota_evidence_postgres.py --ignore=tests/providers/odds_api_v4/test_capture_state_postgres.py --ignore=tests/providers/odds_api_v4/test_capture_request_postgres.py
      - name: Test no-credit Odds API account probe and staging persistence
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_phase4_odds_account_probe.py
      - name: Test provider-neutral free-first access policy
        run: python -m pytest --import-mode=importlib -q tests/providers/test_provider_access.py
      - name: Test offline OpenLigaDB response parser
