name: VELTRIX — OpenPlay PIT Feature Snapshot Admission

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - ".github/workflows/phase4-openplay-feature-snapshot-admission.yml"
      - "scripts/veltrix_v2/persist_openplay_feature_snapshots.py"
      - "scripts/veltrix_v2/build_openplay_feature_bundle.py"
      - "veltrix_v2/data/openplay_feature_bundle.py"
      - "tests/scripts/test_persist_openplay_feature_snapshots.py"
      - "veltrix_v2/models/openplay_xg_poisson.py"
      - "scripts/veltrix_v2/generate_openplay_v2_forecasts.py"
      - "tests/veltrix_v2/test_openplay_xg_poisson.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-openplay-pit-feature-snapshot-admission
  cancel-in-progress: false

jobs:
  admit:
    name: Build, persist and verify PIT feature snapshots in staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/v2-report-bundle-wiring-20261114

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned feature pipeline dependencies
        run: |
          python -m pip install duckdb==1.4.2 pytz==2025.2 "psycopg[binary]>=3.2,<4" pytest==8.4.2

      - name: Compile and test snapshot admission and new V2 model
        run: |
          python -m compileall -q scripts/veltrix_v2/persist_openplay_feature_snapshots.py scripts/veltrix_v2/generate_openplay_v2_forecasts.py veltrix_v2/models/openplay_xg_poisson.py
          python -m pytest --import-mode=importlib -q tests/scripts/test_persist_openplay_feature_snapshots.py tests/veltrix_v2/test_openplay_xg_poisson.py

      - name: Rebuild verified OpenPlay feature bundle from staging
        env:
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
        run: python scripts/veltrix_v2/build_openplay_feature_bundle.py --output-dir openplay-feature-bundle

      - name: Persist eligible target snapshots and verify post-commit
        env:
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
        run: |
          python -m scripts.veltrix_v2.persist_openplay_feature_snapshots \
            --manifest openplay-feature-bundle/openplay_feature_bundle_manifest.json \
            --output artifacts/openplay-feature-snapshot-admission/summary.json

      - name: Generate fresh PIT-eligible V2 prospective forecast series
        env:
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
        run: |
          python -m scripts.veltrix_v2.generate_openplay_v2_forecasts --output artifacts/openplay-v2-forecasts/summary.json

      - name: Upload non-raw snapshot and forecast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-openplay-pit-feature-snapshots-${{ github.run_id }}
          path: |
            artifacts/openplay-feature-snapshot-admission/summary.json
            artifacts/openplay-v2-forecasts/summary.json
          if-no-files-found: warn
          retention-days: 30
