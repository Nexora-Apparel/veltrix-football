name: VELTRIX Phase 4.3 PostgreSQL Reservation Tests

on:
  pull_request:
    paths:
      - "db/migrations/0005_provider_credit_reservation_ledger.sql"
      - "tests/providers/odds_api_v4/**"
      - ".github/workflows/phase4-credit-reservation-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-reservation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrix_reservation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_reservation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veltrix_reservation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest "psycopg[binary]"
      - name: Test reservation migration, idempotency, immutability and concurrency
        run: python -m pytest --import-mode=importlib -q tests/providers/odds_api_v4/test_reservation_postgres.py
