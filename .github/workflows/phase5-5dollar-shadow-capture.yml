name: VELTRIX Phase 2 — 5Dollar Fixture Evidence Capture (No Model)

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - ".github/workflows/phase5-5dollar-shadow-capture.yml"
      - "scripts/phase5_collect_5dollar_shadow.py"
      - "tests/scripts/test_phase5_collect_5dollar_shadow.py"
  workflow_dispatch:
    inputs:
      history_days:
        description: "Finished-results lookback (1–90 days)"
        required: true
        default: "90"
        type: string
      upcoming_days:
        description: "Upcoming fixture window (1–14 days)"
        required: true
        default: "14"
        type: string
      max_fixtures:
        description: "Maximum shadow targets (1–25)"
        required: true
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: veltrix-5dollar-shadow-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Bounded provider fixture snapshot capture (no model or paper ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and PostgreSQL client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "psycopg[binary]>=3.2,<4"

      - name: Validate dry-run mode
        run: python -m scripts.phase5_collect_5dollar_shadow --persist-staging --fixtures-only

      - name: Execute bounded fixture evidence capture only
        env:
          FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
        run: |
          python -m scripts.phase5_collect_5dollar_shadow \
            --execute \
            --history-days "${{ inputs.history_days || '90' }}" \
            --upcoming-days "${{ inputs.upcoming_days || '14' }}" \
            --max-fixtures "${{ inputs.max_fixtures || '25' }}" \
            --out artifacts/5dollar-shadow \
            --persist-staging \
            --fixtures-only

      - name: Upload aggregate-only audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-5dollar-fixture-evidence-${{ github.run_id }}
          path: artifacts/5dollar-shadow/public_summary.json
          if-no-files-found: warn
          retention-days: 7
