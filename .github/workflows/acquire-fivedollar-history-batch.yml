name: Manual 5Dollar Historical Acquisition Batch

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive Africa/Lagos historical start date (YYYY-MM-DD)"
        required: true
        type: string
      end_date:
        description: "Inclusive Africa/Lagos historical end date; maximum seven days"
        required: true
        type: string
      max_requests:
        description: "Hard HTTP-attempt ceiling for this batch (5-20)"
        required: true
        default: "15"
        type: string
      max_pages_per_competition:
        description: "Maximum pages per qualified competition (1-3)"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: fivedollar-historical-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
      VELTRIX_QUALIFICATION_ATTESTATION_KEY: ${{ secrets.VELTRIX_QUALIFICATION_ATTESTATION_KEY }}
      VELTRIX_RAW_EVIDENCE_ENCRYPTION_KEY: ${{ secrets.VELTRIX_RAW_EVIDENCE_ENCRYPTION_KEY }}
    steps:
      - name: Check out historical acquisition implementation
        uses: actions/checkout@v4
        with:
          ref: 64b74f85dc00d3ccb2ef3eb647b6b7d7bea64c0f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs and run secret-free regression tests
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          MAX_PAGES: ${{ inputs.max_pages_per_competition }}
        run: |
          python -m pip install "cryptography>=42.0.0,<47.0.0"
          python - <<'PY'
          import os
          from datetime import date
          start, end = date.fromisoformat(os.environ["START_DATE"]), date.fromisoformat(os.environ["END_DATE"])
          assert 0 <= (end - start).days <= 6, "batch must cover at most seven inclusive dates"
          assert 5 <= int(os.environ["MAX_REQUESTS"]) <= 20
          assert 1 <= int(os.environ["MAX_PAGES"]) <= 3
          PY
          python -m unittest discover -s tests -p 'test_fivedollar_history_batch.py' -v
          python -m unittest discover -s tests -p 'test_provider_acquisition_adapters.py' -v
          python -m unittest discover -s tests -p 'test_provider_fixture_normalizer.py' -v
          python -m unittest discover -s tests -p 'test_encrypted_source_evidence.py' -v
          python scripts/acquire_fivedollar_history_batch.py --help

      - name: Install provider and encryption runtime dependencies
        run: python -m pip install "requests>=2.32.0,<3.0.0" "cryptography>=42.0.0,<47.0.0"

      - name: Fail closed when evidence encryption key is unavailable
        run: |
          test -n "$VELTRIX_RAW_EVIDENCE_ENCRYPTION_KEY"
          test -n "$VELTRIX_QUALIFICATION_ATTESTATION_KEY"

      - name: Acquire signed-registry-scoped historical batch
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          MAX_PAGES: ${{ inputs.max_pages_per_competition }}
        run: |
          python scripts/acquire_fivedollar_history_batch.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --max-requests "$MAX_REQUESTS" \
            --max-pages-per-competition "$MAX_PAGES" \
            --registry data/provider_qualification_registry.json \
            --output fivedollar_history_batch.json

      - name: Verify acquisition artifact integrity
        run: python scripts/verify_acquisition_artifact.py fivedollar_history_batch.json

      - name: Verify encrypted evidence manifest is present and raw report stays sanitized
        run: |
          test -s fivedollar_source_evidence.enc
          test -s fivedollar_source_evidence.enc.manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('fivedollar_history_batch.json').read_text())
          manifest = json.loads(Path('fivedollar_source_evidence.enc.manifest.json').read_text())
          forbidden = {'payload', 'raw_payload', 'raw_row', 'source_payload'}
          def walk(value):
              if isinstance(value, dict):
                  assert not (forbidden & value.keys()), 'raw payload field leaked into report'
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(report)
          assert manifest['report_sha256'] == report['report_sha256']
          assert manifest['evidence_count'] == len(report['records'])
          PY

      - name: Upload sanitized historical acquisition report
        uses: actions/upload-artifact@v4
        with:
          name: fivedollar-historical-batch
          path: |
            fivedollar_history_batch.json
            fivedollar_source_evidence.enc
            fivedollar_source_evidence.enc.manifest.json
          if-no-files-found: error
          retention-days: 14
