name: OpenPlay Historical Data Qualification

on:
  push:
    branches: [main, integration/v2-report-bundle-wiring-20261114]
    paths:
      - '.github/workflows/openplay-historical-data-qualification.yml'
      - 'scripts/veltrix_v2/qualify_openplay_release.py'
      - 'scripts/veltrix_v2/import_openplay_staging.py'
      - 'scripts/veltrix_v2/audit_openplay_staging.py'
      - 'scripts/veltrix_v2/build_openplay_identity_crosswalk_candidates.py'
      - 'tests/veltrix_v2/test_openplay_identity_crosswalk_candidates.py'
      - 'tests/veltrix_v2/test_openplay_staging_import.py'
      - 'docs/legal/openplay-whoscored-opta-authorization-2026-11-15.md'
      - 'tests/veltrix_v2/test_openplay_rights_acceptance.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-openplay-historical-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify pinned OpenPlay player, lineup and xG tables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Parquet reader
        run: python -m pip install duckdb==1.4.2 pytz==2025.2

      - name: Validate qualification script and rights contract
        run: |
          python -m py_compile scripts/veltrix_v2/qualify_openplay_release.py scripts/veltrix_v2/import_openplay_staging.py scripts/veltrix_v2/audit_openplay_staging.py scripts/veltrix_v2/build_openplay_identity_crosswalk_candidates.py
          python -m pip install pytest==8.4.2 "psycopg[binary]>=3.2,<4"
          python -m pytest -q tests/veltrix_v2/test_openplay_rights_acceptance.py tests/veltrix_v2/test_openplay_staging_import.py tests/veltrix_v2/test_openplay_identity_crosswalk_candidates.py

      - name: Download and qualify OpenPlay release
        run: python scripts/veltrix_v2/qualify_openplay_release.py openplay-audit

      - name: Import verified OpenPlay assets into isolated Neon staging
        if: github.ref == 'refs/heads/integration/v2-report-bundle-wiring-20261114'
        env:
          DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
          VELTRIX_ENABLE_OPENPLAY_STAGING_IMPORT: "YES"
        run: python scripts/veltrix_v2/import_openplay_staging.py --input-dir openplay-audit

      - name: Independently audit Neon staging read-back
        if: github.ref == 'refs/heads/integration/v2-report-bundle-wiring-20261114'
        env:
          DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
          VELTRIX_ENABLE_OPENPLAY_STAGING_IMPORT: "YES"
        run: python scripts/veltrix_v2/audit_openplay_staging.py --input-dir openplay-audit

      - name: Build conservative OpenPlay identity crosswalk candidates
        env:
          DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
        run: python scripts/veltrix_v2/build_openplay_identity_crosswalk_candidates.py --input-dir openplay-audit --output openplay-audit/openplay_identity_crosswalk_candidates.json

      - name: Upload verified release bundle and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-openplay-historical-qualification
          path: openplay-audit/
          if-no-files-found: warn
          retention-days: 90
