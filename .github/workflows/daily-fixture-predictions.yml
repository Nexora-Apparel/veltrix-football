name: Daily Fixture Predictions

on:
  push:
    branches: [main]
    paths:
      - "app/config.py"
      - "app/historical_data.py"
      - "app/football_api.py"
      - "app/live_predictions.py"
      - "app/advanced_models.py"
      - "app/recent_results.py"
      - "app/paper_tracking.py"
      - "app/telegram_commands.py"
      - "app/report_artifacts.py"
      - "scripts/publish_command_data.py"
      - "tests/test_report_artifacts.py"
      - "app/telegram_security.py"
      - "tests/test_telegram_security.py"
      - "tests/test_filter_report_for_delivery.py"
      - "api/telegram.py"
      - "api/index.py"
      - "main.py"
      - "requirements.txt"
      - "scripts/configure_telegram_webhook.py"
      - "scripts/run_daily_predictions.py"
      - "scripts/import_open_dataset.py"
      - "scripts/run_paper_tracking.py"
      - "scripts/evaluate_paper_predictions.py"
      - "scripts/filter_report_for_delivery.py"
      - "scripts/send_telegram_report.py"
      - "tests/test_historical_data.py"
      - "tests/test_football_api_odds.py"
      - "tests/test_live_predictions.py"
      - "tests/test_advanced_models.py"
      - "tests/test_backtest_engine.py"
      - "tests/test_import_open_dataset.py"
      - "tests/test_recent_results.py"
      - "tests/test_recent_results_timezone.py"
      - "tests/test_run_daily_predictions.py"
      - "tests/test_paper_tracking.py"
      - "tests/test_telegram_report.py"
      - "tests/test_telegram_commands.py"
      - "app/telegram_security.py"
      - "tests/test_telegram_security.py"
      - ".github/workflows/daily-fixture-predictions.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/config.py"
      - "app/historical_data.py"
      - "app/football_api.py"
      - "app/live_predictions.py"
      - "app/advanced_models.py"
      - "app/recent_results.py"
      - "app/paper_tracking.py"
      - "scripts/run_daily_predictions.py"
      - "scripts/import_open_dataset.py"
      - "scripts/run_paper_tracking.py"
      - "scripts/evaluate_paper_predictions.py"
      - "scripts/send_telegram_report.py"
      - "scripts/filter_report_for_delivery.py"
      - "tests/test_filter_report_for_delivery.py"
      - "tests/test_football_api_odds.py"
      - "tests/test_live_predictions.py"
      - "tests/test_advanced_models.py"
      - "tests/test_backtest_engine.py"
      - "tests/test_import_open_dataset.py"
      - "tests/test_recent_results.py"
      - "tests/test_recent_results_timezone.py"
      - "tests/test_run_daily_predictions.py"
      - "tests/test_paper_tracking.py"
      - "tests/test_telegram_report.py"
      - ".github/workflows/daily-fixture-predictions.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "Nigeria-local fixture date (YYYY-MM-DD); blank means today in Africa/Lagos"
        required: false
        type: string
  schedule:
    # 06:00 Africa/Lagos (WAT, UTC+1) = 05:00 UTC; publish before most match kickoffs.
    - cron: "0 5 * * *"

# Pushes run tests only; live provider calls are restricted to scheduled or manually dispatched runs.
# This prevents code commits and automated fixes from consuming the daily Highlightly quota.
# Reuse mode is only for same-day artifacts when the Highlightly quota is exhausted.
# Reuse publication also recalculates all fixture-status counters after delivery filtering.

permissions:
  contents: write
  actions: read

jobs:
  daily-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Evaluate previous day's forecasts
        id: paper-tracking
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        continue-on-error: true
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TARGET_DATE: ${{ inputs.date }}
          PYTHONPATH: .
        run: |
          if [ -z "$TARGET_DATE" ]; then TARGET_DATE="$(TZ=Africa/Lagos date +%F)"; fi
          PAPER_DATE="$(TZ=Africa/Lagos date -d "$TARGET_DATE - 1 day" +%F)"
          python scripts/run_paper_tracking.py --date "$PAPER_DATE" --output reports/paper_tracking_ledger.json
      - name: Validate paper ledger before upload
        id: paper-ledger-check
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false) && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        run: |
          if [ ! -f reports/paper_tracking_ledger.json ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS="$(python -c 'import json; print(json.load(open("reports/paper_tracking_ledger.json", encoding="utf-8")).get("last_attempt", {}).get("status", "UNKNOWN"))')"
          if [ "$STATUS" = "TRACKING_ERROR" ]; then
            echo "::warning::Paper tracking failed; do not replace the last known-good cumulative ledger."
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import historical matches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        run: python scripts/import_open_dataset.py --from 2020-01-01 --to "$(date -u +%F)" --output data/open_historical_matches.csv
      - name: Download resumable recent-results cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p reports
          CACHE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/command-data/public-data/recent_results_cache.json"
          if curl -fsSL --max-time 15 "$CACHE_URL" -o reports/recent_results_cache.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/recent_results_cache.json")
          try:
              value = json.loads(path.read_text(encoding="utf-8"))
              valid = isinstance(value, dict) and value.get("version") == 1 and isinstance(value.get("matches"), list) and isinstance(value.get("state"), dict)
          except (OSError, json.JSONDecodeError):
              valid = False
          if not valid:
              path.write_text('{"version":1,"matches":[],"state":{}}', encoding="utf-8")
              print("Saved recent-results cache was invalid; starting a clean cache.")
          else:
              print(f"Loaded recent-results cache with {len(value['matches'])} matches.")
          PY
          else
            printf '%s\n' '{"version":1,"matches":[],"state":{}}' > reports/recent_results_cache.json
            echo "No saved recent-results cache exists yet; a new cache will be initialized."
          fi

      - name: Download previous same-day report for quota-safe delivery
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        uses: actions/download-artifact@v7
        with:
          name: veltrix-daily-predictions
          path: reports/raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40175707059

      - name: Download saved paper ledger for quota-safe publication
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        uses: actions/download-artifact@v7
        with:
          name: veltrix-paper-ledger
          path: reports/ledger-raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40175707059

      - name: Restore saved paper ledger
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        run: |
          LEDGER_FILE="$(find reports/ledger-raw -type f -name 'paper_tracking_ledger.json' -print -quit)"
          if [ -n "$LEDGER_FILE" ]; then
            cp "$LEDGER_FILE" reports/paper_tracking_ledger.json
          else
            echo "::warning::Saved paper ledger artifact did not contain paper_tracking_ledger.json."
          fi

      - name: Filter saved report to future same-day fixtures
        id: filter-saved-report
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        run: python scripts/filter_report_for_delivery.py --input reports/raw/daily_predictions.json --output reports/daily_predictions.json

      - name: Generate daily fixture report
        id: generate-report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TARGET_DATE: ${{ inputs.date }}
          PYTHONPATH: .
        run: |
          if [ -z "$HIGHLIGHTLY_API_KEY" ]; then
            echo "::error::Repository secret HIGHLIGHTLY_API_KEY is missing."
            exit 1
          fi
          if [ -z "${TARGET_DATE:-}" ]; then TARGET_DATE="$(TZ=Africa/Lagos date +%F)"; fi
          python scripts/run_daily_predictions.py --date "$TARGET_DATE" --history data/open_historical_matches.csv --output reports/daily_predictions.json --recent-cache reports/recent_results_cache.json
      - name: Notify Telegram when live report generation fails
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false) && failure() && steps.generate-report.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Live report failed and Telegram failure notification is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' \
            'VELTRIX FOOTBALL — LIVE REPORT FAILED' \
            'No live predictions were generated or sent.' \
            'The live data provider rejected the request. Open the failed GitHub Actions run for the exact cause.' \
            'No fallback or fabricated predictions were published.')"
          curl --fail --silent --show-error --retry 2 \
            --get "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Check Telegram configuration
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram delivery skipped because its two secrets are not both configured."
          fi
      - name: Register Telegram Command Centre webhook
        continue-on-error: true
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false) && steps.telegram-config.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL: https://veltrix-football-commands.vercel.app/api/index
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "::notice::Telegram Command Centre webhook not registered; add TELEGRAM_WEBHOOK_SECRET to repository Actions secrets and Vercel environment variables."
          else
            python scripts/configure_telegram_webhook.py
          fi

      - name: Send daily report to Telegram
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false) && steps.telegram-config.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: python scripts/send_telegram_report.py --report reports/daily_predictions.json --ledger reports/paper_tracking_ledger.json
      - name: Upload daily prediction report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false) && (steps.generate-report.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-daily-predictions
          path: reports/daily_predictions.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload cumulative paper-tracking ledger
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || false) && !contains(github.event.head_commit.message, '[reuse-report-40175707059]') && steps.paper-ledger-check.outputs.safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-paper-ledger
          path: reports/paper_tracking_ledger.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish validated command data snapshots
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]'))) && (steps.generate-report.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REUSE_REPORT: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]') }}
          PYTHONPATH: .
        run: |
          ARGS=(--report reports/daily_predictions.json)
          if { [ "${{ steps.paper-ledger-check.outputs.safe }}" = "true" ] || [ "$REUSE_REPORT" = "true" ]; } && [ -f reports/paper_tracking_ledger.json ]; then
            ARGS+=(--ledger reports/paper_tracking_ledger.json)
          fi
          if [ "$REUSE_REPORT" != "true" ] && [ -f reports/recent_results_cache.json ]; then
            ARGS+=(--recent-cache reports/recent_results_cache.json)
          fi
          python scripts/publish_command_data.py "${ARGS[@]}"
