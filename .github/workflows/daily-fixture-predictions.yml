name: Daily Fixture Predictions

on:
  push:
    branches: [main]
    paths:
      - "app/live_predictions.py"
      - "app/paper_tracking.py"
      - "scripts/run_daily_predictions.py"
      - "scripts/run_paper_tracking.py"
      - "scripts/evaluate_paper_predictions.py"
      - "scripts/send_telegram_report.py"
      - "tests/test_live_predictions.py"
      - "tests/test_paper_tracking.py"
      - "tests/test_telegram_report.py"
      - ".github/workflows/daily-fixture-predictions.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/live_predictions.py"
      - "scripts/run_daily_predictions.py"
      - "scripts/send_telegram_report.py"
      - "tests/test_live_predictions.py"
      - "tests/test_telegram_report.py"
      - ".github/workflows/daily-fixture-predictions.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "Nigeria-local fixture date (YYYY-MM-DD); blank means today in Africa/Lagos"
        required: false
        type: string
  schedule:
    # 08:00 Africa/Lagos (WAT, UTC+1) = 07:00 UTC.
    - cron: "0 7 * * *"

permissions:
  contents: read
  actions: read

jobs:
  daily-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Evaluate previous day's forecasts
        id: paper-tracking
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TARGET_DATE: ${{ inputs.date }}
          PYTHONPATH: .
        run: |
          if [ -z "$TARGET_DATE" ]; then TARGET_DATE="$(TZ=Africa/Lagos date +%F)"; fi
          PAPER_DATE="$(TZ=Africa/Lagos date -d "$TARGET_DATE - 1 day" +%F)"
          python scripts/run_paper_tracking.py --date "$PAPER_DATE" --output reports/paper_tracking_ledger.json
      - name: Import historical matches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/import_open_dataset.py --from 2020-01-01 --to "$(date -u +%F)" --output data/open_historical_matches.csv
      - name: Generate daily fixture report
        id: generate-report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TARGET_DATE: ${{ inputs.date }}
          PYTHONPATH: .
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::error::Repository secret API_FOOTBALL_KEY is missing."
            exit 1
          fi
          if [ -z "${TARGET_DATE:-}" ]; then TARGET_DATE="$(TZ=Africa/Lagos date +%F)"; fi
          python scripts/run_daily_predictions.py --date "$TARGET_DATE" --history data/open_historical_matches.csv --output reports/daily_predictions.json
      - name: Check Telegram configuration
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram delivery skipped because its two secrets are not both configured."
          fi
      - name: Send daily report to Telegram
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && steps.telegram-config.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: python scripts/send_telegram_report.py --report reports/daily_predictions.json --ledger reports/paper_tracking_ledger.json
      - name: Upload daily prediction report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.generate-report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-daily-predictions
          path: reports/daily_predictions.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload cumulative paper-tracking ledger
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.paper-tracking.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-paper-ledger
          path: reports/paper_tracking_ledger.json
          if-no-files-found: warn
          retention-days: 90
