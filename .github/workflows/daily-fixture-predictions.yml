      - ".github/workflows/womens-history-coverage-audit.yml"
      - ".github/workflows/daily-fixture-predictions.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "Nigeria-local fixture date (YYYY-MM-DD); blank means today in Africa/Lagos"
        required: false
        type: string
  schedule:
    # Pipeline starts at 05:00 Africa/Lagos (WAT, UTC+1) = 04:00 UTC; Telegram send is gated to 06:00 WAT.
    - cron: "0 4 * * *"
    # Post-fix verification uses the [run-live-verification] push marker for controlled end-to-end checks.
    # Research counters distinguish queued fixtures from searches actually executed.
    # Verified history requires exact squad identity and two independent trusted sources.

# Controlled same-day snapshot replay for the current 2026-11-02 report; no provider refetch.
# Ordinary pushes run tests only. A push commit containing [run-live-verification] intentionally runs the full live pipeline for controlled end-to-end verification.
# Controlled verification is explicitly requested for this commit; keep provider failures visible and never publish fallback predictions.
# This prevents code commits and automated fixes from consuming live provider quotas.
# Reuse mode is only for same-day artifacts when the primary provider is unavailable.
# Reuse publication also recalculates all fixture-status counters after delivery filtering.

# Serialize scheduled/manual live runs so they cannot overwrite each other's cache cursor.
# Push-triggered test runs use a separate group and do not block live data runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[reuse-report-40175707059]') && 'replay' || contains(github.event.head_commit.message, '[run-live-verification]') && 'live' || 'tests') || 'live' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  daily-predictions:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]'))) && 'veltrix-5dollar-provider' || format('veltrix-daily-tests-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        id: unit-tests
        run: python -m pytest -q

      - name: Validate embedded dashboard JavaScript syntax
        id: dashboard-js
        run: |
          python - <<'PY'
          import pathlib
          import re
          source = pathlib.Path("api/telegram.py").read_text(encoding="utf-8")
          match = re.search(r'DASHBOARD_HTML\s*=\s*"""(.*?)"""', source, re.S)
          if not match:
              raise SystemExit("DASHBOARD_HTML block not found")
          scripts = re.findall(r"<script>(.*?)</script>", match.group(1), re.S)
          if not scripts:
              raise SystemExit("No embedded dashboard script found")
          pathlib.Path("/tmp/veltrix-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/veltrix-dashboard.js
      - name: Evaluate previous day's forecasts
        id: paper-tracking
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TARGET_DATE: ${{ inputs.date }}
          PYTHONPATH: .
        run: |
          if [ -z "$TARGET_DATE" ]; then TARGET_DATE="$(TZ=Africa/Lagos date +%F)"; fi
          PAPER_DATE="$(TZ=Africa/Lagos date -d "$TARGET_DATE - 1 day" +%F)"
          python scripts/run_paper_tracking.py --date "$PAPER_DATE" --output reports/paper_tracking_ledger.json
      - name: Validate paper ledger before upload
        id: paper-ledger-check
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false) && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        run: |
          if [ ! -f reports/paper_tracking_ledger.json ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS="$(python -c 'import json; print(json.load(open("reports/paper_tracking_ledger.json", encoding="utf-8")).get("last_attempt", {}).get("status", "UNKNOWN"))')"
          if [ "$STATUS" = "TRACKING_ERROR" ]; then
            echo "::warning::Paper tracking failed; do not replace the last known-good cumulative ledger."
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import historical dataset snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        run: python scripts/import_open_dataset.py --from 2020-01-01 --to "$(date -u +%F)" --output data/open_historical_matches.csv
      - name: Download resumable recent-results cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]'))
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p reports
          CACHE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/command-data/public-data/recent_results_cache.json"
          if curl -fsSL --max-time 15 "$CACHE_URL" -o reports/recent_results_cache.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/recent_results_cache.json")
          try:
              value = json.loads(path.read_text(encoding="utf-8"))
              valid = isinstance(value, dict) and value.get("version") in (1, 2) and isinstance(value.get("matches"), list) and isinstance(value.get("state"), dict)
          except (OSError, json.JSONDecodeError):
              valid = False
          if not valid:
              path.write_text('{"version":2,"matches":[],"state":{}}', encoding="utf-8")
              print("Saved recent-results cache was invalid; starting a clean cache.")
          else:
              print(f"Loaded recent-results cache v{value['version']} with {len(value['matches'])} matches.")
          PY
          else
            printf '%s\n' '{"version":2,"matches":[],"state":{}}' > reports/recent_results_cache.json
            echo "No saved recent-results cache exists yet; a new cache will be initialized."
          fi

      - name: Download previous same-day report for quota-safe delivery
        id: previous-same-day-report
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p reports/raw
          curl --fail --silent --show-error --retry 2 --max-time 45 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/command-data/public-data/daily_predictions.json" \
            -o reports/raw/daily_predictions.json

      - name: Download saved paper ledger for quota-safe publication
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p reports/ledger-raw
          curl --fail --silent --show-error --retry 2 --max-time 45 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/command-data/public-data/paper_tracking_ledger.json" \
            -o reports/ledger-raw/paper_tracking_ledger.json

      - name: Restore saved paper ledger
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        run: |
          LEDGER_FILE="$(find reports/ledger-raw -type f -name 'paper_tracking_ledger.json' -print -quit)"
          if [ -n "$LEDGER_FILE" ]; then
            cp "$LEDGER_FILE" reports/paper_tracking_ledger.json
          else
            echo "::warning::Saved paper ledger artifact did not contain paper_tracking_ledger.json."
          fi

      - name: Filter saved report to future same-day fixtures
        id: filter-saved-report
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        env:
          PYTHONPATH: .
        run: python scripts/filter_report_for_delivery.py --input reports/raw/daily_predictions.json --output reports/daily_predictions.json

      - name: Generate daily fixture report from 5DollarFootballAPI
        id: generate-report
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false && !contains(github.event.head_commit.message, '[reuse-report-40175707059]')
        env:
          FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          VELTRIX_LIVE_HISTORY_LICENSED_ONLY: "true"
          TARGET_DATE: ${{ inputs.date }}
          VELTRIX_TEST_FORCE_PROVIDER_OUTAGE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[simulate-provider-outage]') }}
          PYTHONPATH: .
        run: |
          if [ "${VELTRIX_TEST_FORCE_PROVIDER_OUTAGE:-false}" = "true" ]; then
            echo "::warning::Controlled provider-outage simulation; no provider request was made."
            exit 1
          fi
          if [ -z "$FIVEDOLLARFOOTBALL_API_KEY" ]; then
            echo "::error::Repository secret FIVEDOLLARFOOTBALL_API_KEY is missing."
            exit 1
          fi
          if [ -z "${TARGET_DATE:-}" ]; then TARGET_DATE="$(TZ=Africa/Lagos date +%F)"; fi
          python scripts/run_daily_predictions.py --date "$TARGET_DATE" --history data/open_historical_matches.csv --output reports/daily_predictions.json --recent-cache reports/recent_results_cache.json
      - name: Recover today's saved report after a primary-provider outage
        id: report-recovery
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]'))) && steps.generate-report.outcome == 'failure'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .
        run: |
          mkdir -p reports/recovery
          SAVED_REPORT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/command-data/public-data/daily_predictions.json"
          curl --fail --silent --show-error --retry 2 --max-time 45 "$SAVED_REPORT_URL" -o reports/recovery/daily_predictions.previous.json
          python scripts/filter_report_for_delivery.py --input reports/recovery/daily_predictions.previous.json --output reports/daily_predictions.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/daily_predictions.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": "REUSED_SAME_DAY_SNAPSHOT",
              "as_of_date": report.get("as_of_date"),
              "fixtures_retained": len(report.get("predictions") or []),
              "publication_status": report.get("publication_status"),
          }, sort_keys=True))
          PY
      - name: Discover external research sources for missing-history fixtures
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]'))) && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success')
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONPATH: .
        run: |
          if [ -f reports/daily_predictions.json ]; then
            python -m app.research_evidence --report reports/daily_predictions.json
          else
            echo "::warning::No report available for source discovery."
          fi

      - name: Enrich report with optional OddsPapi BTTS and Over Under prices
        id: odds-enrichment
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false) && steps.generate-report.outcome == 'success'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          PYTHONPATH: .
        run: python scripts/enrich_oddspapi_odds.py --report reports/daily_predictions.json

      - name: Restore and update prospective value evidence ledger
        id: value-evidence-update
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]'))) && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .
        run: |
          mkdir -p reports
          LEDGER_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/command-data/public-data/value_evidence_ledger.json"
          if curl -fsSL --max-time 15 "$LEDGER_URL" -o reports/value_evidence_ledger.previous.json; then
            echo "Restored existing append-only value evidence ledger."
          else
            printf '%s\n' '{"version":"VELTRIX_VALUE_EVIDENCE_V1","observations":[],"price_series":[]}' > reports/value_evidence_ledger.previous.json
            echo "No prior evidence ledger exists; initializing a new ledger."
          fi
          python scripts/update_value_evidence_ledger.py --report reports/daily_predictions.json --ledger reports/value_evidence_ledger.previous.json --results reports/recent_results_cache.json --output reports/value_evidence_ledger.json
      - name: Upload prospective value evidence ledger
        id: value-evidence-artifact
        if: always() && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success') && hashFiles('reports/value_evidence_ledger.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-value-evidence-ledger
          path: reports/value_evidence_ledger.json
          retention-days: 90
      - name: Build market-specific value validation certificate
        id: value-certificate
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false) && (steps.generate-report.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .
        run: python scripts/build_value_certificate_runtime_v2.py --report reports/daily_predictions.json --ledger reports/paper_tracking_ledger.json --output reports/value_validation_certificate.json

      - name: Validate fixture visibility before publication and Telegram
        id: fixture-visibility-validation
        if: always() && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        env:
          PYTHONPATH: .
        run: python scripts/validate_fixture_visibility.py --report reports/daily_predictions.json

      - name: Notify Telegram when live report generation fails
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false) && !contains(github.event.head_commit.message, '[skip-telegram]') && failure() && steps.generate-report.outcome == 'failure' && steps.report-recovery.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Live report failed and Telegram failure notification is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' \
            'VELTRIX FOOTBALL — LIVE REPORT FAILED' \
            'No live predictions were generated or sent.' \
            'The live data provider rejected the request. Open the failed GitHub Actions run for the exact cause.' \
            'No fallback or fabricated predictions were published.')"
          curl --fail --silent --show-error --retry 2 \
            --get "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Check Telegram configuration
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')) || false) && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram delivery skipped because its two secrets are not both configured."
          fi
      - name: Register Telegram Command Centre webhook
        id: telegram-webhook
        continue-on-error: true
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')) || false) && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success') && !contains(github.event.head_commit.message, '[skip-telegram]') && steps.telegram-config.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL: https://veltrix-football-commands.vercel.app/api/index
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram Command Centre webhook not registered; add TELEGRAM_WEBHOOK_SECRET to repository Actions secrets and Vercel environment variables."
          else
            python scripts/configure_telegram_webhook.py
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hold scheduled delivery until 06:00 WAT
        if: github.event_name == 'schedule'
        run: |
          # The full ingestion/model pipeline starts at 05:00 WAT.
          # Hold only the final Telegram send until 06:00 WAT (05:00 UTC).
          while [ "$(date -u +%H%M)" -lt "0500" ]; do
            sleep 5
          done
      - name: Send daily report to Telegram
        id: telegram-delivery
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')) || false) && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success') && !contains(github.event.head_commit.message, '[skip-telegram]') && steps.telegram-config.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_TELEGRAM_DELIVERY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[force-telegram-resend]') }}
          PYTHONPATH: .
        run: |
          if [ "$FORCE_TELEGRAM_DELIVERY" = "true" ]; then
            python scripts/send_telegram_report.py --report reports/daily_predictions.json --ledger reports/paper_tracking_ledger.json --force
          else
            python scripts/send_telegram_report.py --report reports/daily_predictions.json --ledger reports/paper_tracking_ledger.json
          fi
      - name: Upload daily prediction report
        id: daily-report-artifact
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')) || false) && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-daily-predictions
          path: reports/daily_predictions.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload cumulative paper-tracking ledger
        id: paper-ledger-artifact
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || false) && steps.paper-ledger-check.outputs.safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-paper-ledger
          path: reports/paper_tracking_ledger.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish validated command data snapshots
        id: command-data-publication
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-verification]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]'))) && (steps.generate-report.outcome == 'success' || steps.report-recovery.outcome == 'success' || steps.filter-saved-report.outcome == 'success')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REUSE_REPORT: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-report-40175707059]')) || steps.report-recovery.outcome == 'success' }}
          PYTHONPATH: .
        run: |
          ARGS=(--report reports/daily_predictions.json)
          if { [ "${{ steps.paper-ledger-check.outputs.safe }}" = "true" ] || [ "$REUSE_REPORT" = "true" ]; } && [ -f reports/paper_tracking_ledger.json ]; then
            ARGS+=(--ledger reports/paper_tracking_ledger.json)
          fi
          if [ "$REUSE_REPORT" != "true" ] && [ -f reports/recent_results_cache.json ]; then
            ARGS+=(--recent-cache reports/recent_results_cache.json)
          fi
          if [ -f reports/value_evidence_ledger.json ]; then
            ARGS+=(--value-evidence reports/value_evidence_ledger.json)
          fi
          python scripts/publish_command_data.py "${ARGS[@]}"

      - name: Publish machine-readable verification receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          VELTRIX_STEP_UNIT_TESTS: ${{ steps.unit-tests.outcome }}
          VELTRIX_STEP_DASHBOARD_JS: ${{ steps.dashboard-js.outcome }}
          VELTRIX_STEP_FIXTURE_GENERATION: ${{ steps.generate-report.outcome }}
          VELTRIX_STEP_REPORT_RECOVERY: ${{ steps.report-recovery.outcome }}
          VELTRIX_STEP_SAME_DAY_REPORT_DOWNLOAD: ${{ steps.previous-same-day-report.outcome }}
          VELTRIX_STEP_SAME_DAY_REPORT_FILTER: ${{ steps.filter-saved-report.outcome }}
          VELTRIX_STEP_FIXTURE_VISIBILITY: ${{ steps.fixture-visibility-validation.outcome }}
          VELTRIX_STEP_ODDS_ENRICHMENT: ${{ steps.odds-enrichment.outcome }}
          VELTRIX_STEP_VALUE_EVIDENCE_UPDATE: ${{ steps.value-evidence-update.outcome }}
          VELTRIX_STEP_VALUE_EVIDENCE_ARTIFACT: ${{ steps.value-evidence-artifact.outcome }}
          VELTRIX_STEP_VALUE_CERTIFICATE: ${{ steps.value-certificate.outcome }}
          VELTRIX_STEP_TELEGRAM_WEBHOOK: ${{ steps.telegram-webhook.outputs.configured == 'true' && steps.telegram-webhook.outcome == 'success' && 'success' || 'skipped' }}
          VELTRIX_TELEGRAM_WEBHOOK_CONFIGURED: ${{ steps.telegram-webhook.outputs.configured }}
          VELTRIX_STEP_TELEGRAM_DELIVERY: ${{ steps.telegram-delivery.outcome }}
          VELTRIX_TELEGRAM_CONFIGURED: ${{ steps.telegram-config.outputs.configured }}
          VELTRIX_STEP_DAILY_REPORT_ARTIFACT: ${{ steps.daily-report-artifact.outcome }}
          VELTRIX_STEP_PAPER_LEDGER_ARTIFACT: ${{ steps.paper-ledger-artifact.outcome }}
          VELTRIX_STEP_COMMAND_DATA_PUBLICATION: ${{ steps.command-data-publication.outcome }}
          VELTRIX_STEP_PAPER_TRACKING: ${{ steps.paper-tracking.outcome }}
          VELTRIX_REPORT_PATH: reports/daily_predictions.json
          VELTRIX_VALUE_EVIDENCE_PATH: reports/value_evidence_ledger.json
          VELTRIX_PAPER_LEDGER_PATH: reports/paper_tracking_ledger.json
        run: python scripts/publish_verification_status.py
