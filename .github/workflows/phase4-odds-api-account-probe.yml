name: VELTRIX Phase 4 — Manual The Odds API Account Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-odds-api-account-probe
  cancel-in-progress: false

jobs:
  account-probe:
    name: No-credit account and sport-scope verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and PostgreSQL client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "psycopg[binary]>=3.2,<4"

      - name: Validate dry-run mode
        run: python -m scripts.phase4_odds_account_probe

      - name: Execute no-credit account and entitlement probe
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -m scripts.phase4_odds_account_probe --execute --persist-staging
