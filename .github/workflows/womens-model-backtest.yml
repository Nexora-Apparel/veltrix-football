name: Women's Historical Model Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/backtest_engine.py"
      - "scripts/run_backtest.py"
      - "scripts/import_womens_club_history.py"
      - "tests/test_backtest_engine.py"
      - "tests/test_import_womens_club_history.py"
      - ".github/workflows/womens-model-backtest.yml"

permissions:
  contents: read

jobs:
  womens-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Import isolated women's club dataset
        run: |
          mkdir -p data reports
          python scripts/import_womens_club_history.py --from 2011-01-01 --to "$(date -u +%F)" --output data/womens_club_historical_matches.csv
      - name: Audit exact women's backtest dataset
        run: |
          python scripts/audit_historical_csv.py \
            --input data/womens_club_historical_matches.csv \
            --json-output reports/womens_history_audit.json \
            --markdown-output reports/womens_history_audit.md
      - name: Run chronological women's-only model evaluation
        run: |
          python scripts/run_backtest.py \
            --input data/womens_club_historical_matches.csv \
            --output reports/womens_backtest_summary.json \
            --min-training-matches 100
      - name: Upload isolated women's backtest results
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-womens-model-backtest
          path: |
            reports/womens_backtest_summary.json
            reports/womens_history_audit.json
            reports/womens_history_audit.md
          if-no-files-found: error
          retention-days: 90
