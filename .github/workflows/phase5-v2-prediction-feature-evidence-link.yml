name: VELTRIX Phase 5 — Link V2 Forecasts to PIT Feature Evidence

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Append the seven verified feature-evidence links to staging"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type APPLY_SEVEN_V2_FEATURE_EVIDENCE_LINKS when apply is true"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: veltrix-v2-feature-evidence-link
  cancel-in-progress: false

jobs:
  link:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.apply == false ||
       (inputs.apply == true &&
        inputs.confirmation == 'APPLY_SEVEN_V2_FEATURE_EVIDENCE_LINKS'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
      VELTRIX_ENABLE_PHASE5_V2_PREDICTION_FEATURE_LINKS: ${{ inputs.apply && 'YES' || 'NO' }}
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/v2-report-bundle-wiring-20261114

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Download immutable forecast and feature admission artifacts
        uses: actions/download-artifact@v4
        with:
          name: veltrix-openplay-pit-feature-snapshots-43775129579
          run-id: 43775129579
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/v2-openplay-evidence

      - name: Verify both source artifacts and compile linker
        run: |
          python -m compileall -q scripts/link_v2_prediction_feature_snapshots.py tests/test_link_v2_prediction_feature_snapshots.py
          python -m pytest --import-mode=importlib -q tests/test_link_v2_prediction_feature_snapshots.py
          test -f artifacts/v2-openplay-evidence/openplay-v2-forecasts/summary.json
          test -f artifacts/v2-openplay-evidence/openplay-feature-snapshot-admission/summary.json

      - name: Link PIT evidence (read-only dry run by default)
        run: |
          mkdir -p artifacts/v2-prediction-feature-links
          if [ "${{ inputs.apply }}" = "true" ]; then
            python -m scripts.link_v2_prediction_feature_snapshots \
              --forecast-summary artifacts/v2-openplay-evidence/openplay-v2-forecasts/summary.json \
              --feature-admission-summary artifacts/v2-openplay-evidence/openplay-feature-snapshot-admission/summary.json \
              --apply > artifacts/v2-prediction-feature-links/summary.json
          else
            python -m scripts.link_v2_prediction_feature_snapshots \
              --forecast-summary artifacts/v2-openplay-evidence/openplay-v2-forecasts/summary.json \
              --feature-admission-summary artifacts/v2-openplay-evidence/openplay-feature-snapshot-admission/summary.json \
              > artifacts/v2-prediction-feature-links/summary.json
          fi
          python -c 'import json; d=json.load(open("artifacts/v2-prediction-feature-links/summary.json")); assert d["forecasts"] == 7 and (d["status"] == "PASS_V2_PREDICTION_FEATURE_EVIDENCE_LINKS" if "${{ inputs.apply }}" == "true" else d["status"] == "DRY_RUN_READY")'

      - name: Upload immutable link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-v2-prediction-feature-links-${{ github.run_id }}
          path: artifacts/v2-prediction-feature-links/summary.json
          if-no-files-found: warn
          retention-days: 90
