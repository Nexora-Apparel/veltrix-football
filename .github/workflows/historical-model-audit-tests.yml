name: Historical Model Audit Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_historical_model.py"
      - "tests/test_historical_model_audit.py"
      - ".github/workflows/historical-model-reconstruction.yml"
      - ".github/workflows/historical-model-audit-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_historical_model.py"
      - "tests/test_historical_model_audit.py"
      - ".github/workflows/historical-model-reconstruction.yml"
      - ".github/workflows/historical-model-audit-tests.yml"

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_historical_model_audit.py
