name: VELTRIX Phase 5 — Staging Paper Ledger Migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations 0005–0008 to the allowlisted Neon staging database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: veltrix-staging-paper-ledger-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
      VELTRIX_EXPECTED_DATABASE: veltrix_football_staging
      VELTRIX_EXPECTED_DATABASE_HOST: ep-ancient-block-bcb439pk.c-16.us-east-1.aws.neon.tech
      VELTRIX_EXPECTED_DATABASE_ROLE: neondb_owner
      VELTRIX_ENABLE_PHASE5_PAPER_LEDGER_MIGRATION: ${{ inputs.apply && 'YES' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run guarded dry-run or explicit staging apply
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            python -m scripts.phase5_staging_paper_ledger_migration --apply
          else
            python -m scripts.phase5_staging_paper_ledger_migration
          fi
