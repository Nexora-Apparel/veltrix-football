name: Verify StrikerAPI Read-Only Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-strikerapi.yml"

permissions:
  contents: read

concurrency:
  group: strikerapi-readonly-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
    steps:
      - name: Check out V2 qualification code
        uses: actions/checkout@v4
        with:
          ref: veltrix-2.0-architecture-blueprint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier test dependency
        run: python -m pip install pytest

      - name: Run StrikerAPI verifier unit tests
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_strikerapi_readonly.py

      - name: Compile bounded verifier
        run: python -m py_compile scripts/veltrix_v2/verify_strikerapi_readonly.py

      - name: Run bounded read-only qualification
        run: python scripts/veltrix_v2/verify_strikerapi_readonly.py
