name: Verify StrikerAPI Read-Only Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3/strikerapi-readonly-qualification
    paths:
      - ".github/workflows/verify-strikerapi.yml"
      - "scripts/run_readonly_epl_reconciliation.py"
      - "scripts/reconcile_provider_fixtures.py"
      - "data/provider_team_aliases.json"

permissions:
  contents: read

concurrency:
  group: strikerapi-readonly-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
    steps:
      - name: Check out qualification branch
        uses: actions/checkout@v4
        with:
          ref: phase-3/strikerapi-readonly-qualification

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run StrikerAPI verifier unit tests
        run: python -m unittest discover -s tests -p 'test_strikerapi*.py' -v

      - name: Run bounded read-only qualification
        run: python scripts/verify_strikerapi.py

      - name: Run read-only Premier League cross-provider reconciliation
        run: python scripts/run_readonly_epl_reconciliation.py

      - name: Upload sanitized reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: strikerapi-5dollar-epl-reconciliation
          path: strikerapi_5dollar_epl_reconciliation.json
          if-no-files-found: error
          retention-days: 7
