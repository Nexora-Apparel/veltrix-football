name: Verify StrikerAPI Read-Only Coverage

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/veltrix_v2/verify_strikerapi_readonly.py"
      - ".github/workflows/verify-strikerapi.yml"

permissions:
  contents: read

concurrency:
  group: strikerapi-readonly-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
    steps:
      - name: Check out current V2 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile read-only verifier
        run: python -m py_compile scripts/veltrix_v2/verify_strikerapi_readonly.py

      - name: Run bounded read-only qualification
        run: python scripts/veltrix_v2/verify_strikerapi_readonly.py
