name: Poisson Dixon-Coles Shadow Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app/poisson_dc_head.py"
      - "tests/test_poisson_dc_head.py"
      - ".github/workflows/poisson-dc-tests.yml"
  push:
    branches: ["feature/poisson-dixon-coles-market-head"]
    paths:
      - "app/poisson_dc_head.py"
      - "tests/test_poisson_dc_head.py"
      - ".github/workflows/poisson-dc-tests.yml"

permissions:
  contents: read

jobs:
  poisson-dc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest -q tests/test_poisson_dc_head.py
