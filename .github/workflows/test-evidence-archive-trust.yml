name: Test Encrypted Evidence Archive and KMS Trust

on:
  push:
    branches:
      - rebuild/encrypted-source-evidence
  pull_request:
    branches:
      - rebuild/independent-market-models

permissions:
  contents: read

jobs:
  evidence-archive-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cryptography test dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=42.0.0,<47.0.0"
      - name: Test canonical KMS receipt signatures
        run: python -m unittest discover -s tests -p 'test_evidence_receipt_signing.py' -v
      - name: Test explicit KMS trust registry and key rotation
        run: python -m unittest discover -s tests -p 'test_evidence_receipt_trust.py' -v
      - name: Test encrypted archive, retry and restore
        run: python -m unittest discover -s tests -p 'test_private_evidence_archive.py' -v
      - name: Test encrypted source evidence
        run: python -m unittest discover -s tests -p 'test_encrypted_source_evidence.py' -v
