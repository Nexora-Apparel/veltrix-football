name: Manual 5Dollar Statistics Capability Probe

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Hard maximum provider requests (1-20)"
        required: true
        default: "20"
        type: string
      days:
        description: "Recent finished-fixture sample window (1-90)"
        required: true
        default: "90"
        type: string

permissions:
  contents: read

concurrency:
  group: fivedollar-statistics-capability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate inputs and run offline tests
        env:
          MAX_REQUESTS: ${{ inputs.max_requests }}
          DAYS: ${{ inputs.days }}
        run: |
          python -c "import os; assert 1 <= int(os.environ['MAX_REQUESTS']) <= 20"
          python -c "import os; assert 1 <= int(os.environ['DAYS']) <= 90"
          python -m unittest discover -s tests -p 'test_probe_fivedollar_statistics.py' -v
      - name: Run bounded read-only statistics probe
        env:
          MAX_REQUESTS: ${{ inputs.max_requests }}
          DAYS: ${{ inputs.days }}
        run: |
          python scripts/probe_fivedollar_statistics.py \
            --max-requests "$MAX_REQUESTS" \
            --days "$DAYS" \
            --output fivedollar_statistics_probe.json
      - name: Verify report integrity
        if: always() && hashFiles('fivedollar_statistics_probe.json') != ''
        run: |
          python -c "import json; from scripts.probe_fivedollar_statistics import validate_report; validate_report(json.load(open('fivedollar_statistics_probe.json')))"
      - name: Report missing output
        if: always() && hashFiles('fivedollar_statistics_probe.json') == ''
        run: echo "No report produced; probe did not complete."
      - name: Upload sanitized probe report
        if: always() && hashFiles('fivedollar_statistics_probe.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fivedollar-statistics-capability
          path: fivedollar_statistics_probe.json
          if-no-files-found: error
          retention-days: 7
