name: Verify StrikerAPI Team Alias Candidates

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3/strikerapi-readonly-qualification
    paths:
      - ".github/workflows/verify-strikerapi-team-aliases.yml"
      - "scripts/verify_strikerapi_team_aliases.py"
      - "tests/test_team_alias_verification.py"
      - "app/provider_team_aliases.py"
      - "data/provider_team_aliases.json"
      - "tests/test_provider_team_aliases.py"
      - "scripts/audit_provider_team_crosswalk.py"
      - "tests/test_provider_team_crosswalk.py"

permissions:
  contents: read

concurrency:
  group: strikerapi-team-alias-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
    steps:
      - name: Check out qualification branch
        uses: actions/checkout@v4
        with:
          ref: phase-3/strikerapi-readonly-qualification

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline verifier tests
        run: |
          python -m unittest discover -s tests -p 'test_team_alias_verification.py' -v
          python -m unittest discover -s tests -p 'test_provider_team_aliases.py' -v
          python -m unittest discover -s tests -p 'test_provider_team_crosswalk.py' -v

      - name: Verify provider team catalogues (read-only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_strikerapi_team_aliases.py

      - name: Upload sanitized catalogue report
        if: always() && github.event_name == 'workflow_dispatch' && hashFiles('strikerapi_5dollar_team_alias_verification.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: strikerapi-5dollar-team-alias-verification
          path: strikerapi_5dollar_team_alias_verification.json
          if-no-files-found: error
          retention-days: 7
