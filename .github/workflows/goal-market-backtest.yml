name: BTTS and Over Under Backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/goal_market_backtest.py"
      - "tests/test_goal_market_backtest.py"
      - "app/prediction.py"
      - "app/backtest_engine.py"
      - "app/live_predictions.py"
      - "scripts/import_open_dataset.py"
      - "requirements.txt"
      - ".github/workflows/goal-market-backtest.yml"

permissions:
  contents: read

jobs:
  goal-market-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Import historical dataset
        run: >-
          python scripts/import_open_dataset.py
          --from 2000-01-01
          --to "$(date -u +%F)"
          --output data/open_historical_matches.csv
      - name: Run chronological BTTS and Over Under backtest
        run: >-
          python -m app.goal_market_backtest
          --input data/open_historical_matches.csv
          --output reports/goal_market_backtest.json
      - name: Upload goal-market report
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-goal-market-backtest
          path: reports/goal_market_backtest.json
          if-no-files-found: error
          retention-days: 30
