name: VELTRIX prospective ledger PostgreSQL tests

on:
  push:
    branches:
      - phase5/prospective-evaluation-ledger-20261114
    paths:
      - "db/migrations/free_first/**"
      - "tests/veltrix_v2/test_prospective_ledger_postgres.py"
      - ".github/workflows/prospective-ledger-postgres.yml"
  pull_request:
    paths:
      - "db/migrations/free_first/**"
      - "tests/veltrix_v2/test_prospective_ledger_postgres.py"
      - ".github/workflows/prospective-ledger-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veltrix_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated PostgreSQL test dependencies
        run: python -m pip install --upgrade pip pytest "psycopg[binary]>=3.1,<4"

      - name: Test prospective ledger schema, constraints and append-only behavior
        run: python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_prospective_ledger_postgres.py
