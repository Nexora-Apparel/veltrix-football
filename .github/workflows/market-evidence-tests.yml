name: Market Evidence Reliability Tests

on:
  push:
    branches: ["feature/market-evidence-reliability"]
    paths:
      - "app/market_evidence.py"
      - "tests/test_market_evidence.py"
      - ".github/workflows/market-evidence-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/market_evidence.py"
      - "tests/test_market_evidence.py"
      - ".github/workflows/market-evidence-tests.yml"

permissions:
  contents: read

jobs:
  market-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest -q tests/test_market_evidence.py
      - run: python -m pytest -q
