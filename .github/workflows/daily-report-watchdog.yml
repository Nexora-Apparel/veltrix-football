name: Daily Report Watchdog
# Manual recovery trigger: verify current-day publication and Telegram receipt without altering prediction data.

on:
  # Scheduled recovery only; editing workflow code must never dispatch a live report.
  # Recovery starts only AFTER the 06:00 WAT primary schedule: 06:10, 06:25,
  # 06:40 WAT, then 08:15 and 17:00 WAT. Never dispatch an early report.
  # Each check dispatches only when today's report is missing and no live run is active.
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: veltrix-daily-report-watchdog
  cancel-in-progress: false

jobs:
  ensure-daily-report:
    # PAUSED by user request until VELTRIX FOOTBALL Phase 3 is complete.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Recover value evidence omitted by the 2026-11-01 publication failure
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-value-evidence]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p reports/recovery
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts/13086149741/zip" \
            -o reports/recovery/value-evidence-20261101.zip
          curl --fail --silent --show-error --retry 2 --max-time 60 \
            "https://raw.githubusercontent.com/$GH_REPOSITORY/command-data/public-data/daily_predictions.json" \
            -o reports/recovery/daily_predictions.json
          python scripts/reconcile_value_evidence_recovery.py \
            --artifact-zip reports/recovery/value-evidence-20261101.zip \
            --report reports/recovery/daily_predictions.json \
            --output reports/recovery/value_evidence_ledger.reconciled.json

      - name: Check today's published report
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY="$(TZ=Africa/Lagos date +%F)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          CREATED_WINDOW="$(python - <<'PY'
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("Africa/Lagos")).date()
          start = datetime.combine(today, time.min, ZoneInfo("Africa/Lagos")).astimezone(timezone.utc)
          end = start + timedelta(days=1) - timedelta(seconds=1)
          print(start.strftime("%Y-%m-%dT%H:%M:%SZ") + ".." + end.strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )"
          echo "created_window=$CREATED_WINDOW" >> "$GITHUB_OUTPUT"

          # This is a private repository: use the authenticated Contents API,
          # not an unauthenticated raw.githubusercontent.com request.
          REPORT_URL="https://api.github.com/repos/$GH_REPOSITORY/contents/public-data/daily_predictions.json?ref=command-data"
          REPORT_FILE="$(mktemp)"
          if curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "$REPORT_URL" -o "$REPORT_FILE"; then
            python - "$REPORT_FILE" "$TODAY" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          path, today = sys.argv[1], sys.argv[2]
          try:
              report = json.load(open(path, encoding="utf-8"))
          except Exception:
              report = {}
          from datetime import datetime
          from zoneinfo import ZoneInfo
          generation_status = str(report.get("publication_status") or report.get("report_generation_status") or "UNKNOWN").upper()
          generated_at = report.get("generated_at_utc")
          generated_today = False
          report_age_minutes = None
          try:
              generated_dt = datetime.fromisoformat(str(generated_at).replace("Z", "+00:00"))
              if generated_dt.tzinfo is None:
                  generated_dt = generated_dt.replace(tzinfo=__import__("datetime").timezone.utc)
              now = datetime.now(__import__("datetime").timezone.utc)
              report_age_minutes = (now - generated_dt.astimezone(__import__("datetime").timezone.utc)).total_seconds() / 60
              generated_today = generated_dt.astimezone(ZoneInfo("Africa/Lagos")).date().isoformat() == today
          except (TypeError, ValueError):
              generated_today = False
          # Watchdog runs at 06:10/06:25/06:40 WAT and later. Calendar-date
          # equality alone is not freshness: reject old same-day snapshots.
          max_age_minutes = 90
          age_fresh = report_age_minutes is not None and 0 <= report_age_minutes <= max_age_minutes
          not_reused = generation_status not in {
              "REUSED_SNAPSHOT_NOT_REFRESHED",
              "RECOVERED_SAVED_REPORT_NOT_REFRESHED",
              "PRIMARY_PROVIDER_UNAVAILABLE",
          }
          fresh = (
              report.get("as_of_date") == today
              and generated_today
              and age_fresh
              and not_reused
              and report.get("command_data_publication") == "PUBLISHED"
              and isinstance(report.get("predictions"), list)
          )
          print(f"published={'true' if report.get('command_data_publication') == 'PUBLISHED' else 'false'}")
          print(f"fresh={'true' if fresh else 'false'}")
          print(f"report_date={report.get('as_of_date', 'missing')}")
          print(f"generation_status={generation_status}")
          print(f"generated_today={'true' if generated_today else 'false'}")
          print(f"report_age_minutes={report_age_minutes if report_age_minutes is not None else 'unknown'}")
          print(f"age_fresh={'true' if age_fresh else 'false'}")
          PY
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "report_date=unavailable" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Telegram delivery for today's published report
        id: delivery
        if: steps.freshness.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY="${{ steps.freshness.outputs.today }}"
          curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "per_page=100" \
            --data-urlencode "created=${{ steps.freshness.outputs.created_window }}" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/daily-fixture-predictions.yml/runs" \
            -o /tmp/daily-runs.json
          python - <<'PY' > /tmp/todays-run-ids.txt
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          data = json.load(open("/tmp/daily-runs.json", encoding="utf-8"))
          today = "${{ steps.freshness.outputs.today }}"
          for run in data.get("workflow_runs", []):
              event = run.get("event")
              title = str(run.get("display_title") or "")
              is_live_push = event == "push" and "[run-live-verification]" in title
              if event not in {"schedule", "workflow_dispatch"} and not is_live_push:
                  continue
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")).astimezone(ZoneInfo("Africa/Lagos"))
              if created.date().isoformat() == today:
                  print(run["id"])
          PY
          DELIVERED=false
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              -o /tmp/daily-jobs.json
            if python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/daily-jobs.json", encoding="utf-8"))
          for job in data.get("jobs", []):
              for step in job.get("steps", []):
                  if step.get("name") == "Send daily report to Telegram" and step.get("conclusion") == "success":
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              DELIVERED=true
              break
            fi
          done < /tmp/todays-run-ids.txt
          echo "delivered=$DELIVERED" >> "$GITHUB_OUTPUT"
          echo "Telegram delivery verified: $DELIVERED"

      - name: Check for an active daily pipeline
        id: active
        if: steps.freshness.outputs.fresh != 'true' || steps.delivery.outputs.delivered != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/daily-fixture-predictions.yml/runs?per_page=20" \
            -o /tmp/daily-runs.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("/tmp/daily-runs.json", encoding="utf-8"))
          active = any(
              run.get("status") in {"queued", "in_progress"}
              and (
                  run.get("event") in {"schedule", "workflow_dispatch"}
                  or (
                      run.get("event") == "push"
                      and "[run-live-verification]" in str(run.get("display_title") or "")
                  )
              )
              for run in data.get("workflow_runs", [])
          )
          print(f"active={'true' if active else 'false'}")
          PY

      - name: Dispatch today's report if missing
        if: (steps.freshness.outputs.fresh != 'true' || steps.delivery.outputs.delivered != 'true') && steps.active.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_DATE: ${{ steps.freshness.outputs.today }}
        run: |
          set -euo pipefail
          BODY="$(python -c 'import json,os; print(json.dumps({"ref":"main","inputs":{"date":os.environ["TARGET_DATE"]}}))')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/daily-fixture-predictions.yml/dispatches"
          echo "Today's report was missing; dispatched the normal live pipeline for $TARGET_DATE."

      - name: Record healthy or already-running state
        if: (steps.freshness.outputs.fresh == 'true' && steps.delivery.outputs.delivered == 'true') || steps.active.outputs.active == 'true'
        run: |
          echo "Today's report is already published, or the normal daily pipeline is still active. No duplicate provider run was started."
