name: Test Independent Market Model Rebuild

on:
  push:
    branches:
      - rebuild/independent-market-models
      - rebuild/encrypted-source-evidence
  pull_request:
    branches:
      - phase-3/budget-aware-acquisition-contract

permissions:
  contents: read

jobs:
  independent-market-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'cryptography>=42.0.0,<47.0.0'
      - name: Run Poisson and Dixon-Coles model tests
        run: python -m pytest -q tests/test_poisson_dc_head.py tests/test_poisson_dixon_coles_model.py
      - name: Run independent market model tests
        run: python -m unittest discover -s tests -p 'test_independent_market_models.py' -v
      - name: Run raw source evidence archive tests
        run: python -m unittest discover -s tests -p 'test_provider_source_evidence.py' -v
      - name: Run private evidence archive and KMS receipt-signature tests
        run: |
          python -m unittest discover -s tests -p 'test_private_evidence_archive.py' -v
          python -m unittest discover -s tests -p 'test_evidence_receipt_signing.py' -v
      - name: Run provider fixture normalization and batch tests
        run: |
          python -m unittest discover -s tests -p 'test_provider_fixture_normalizer.py' -v
          python -m unittest discover -s tests -p 'test_provider_fixture_batch.py' -v
      - name: Run acquisition adapter and artifact integrity tests
        run: |
          python -m unittest discover -s tests -p 'test_provider_acquisition_adapters.py' -v
          python -m unittest discover -s tests -p 'test_provider_acquisition_artifact.py' -v
      - name: Run chronological Elo feature tests
        run: python -m unittest discover -s tests -p 'test_chronological_elo_features.py' -v
      - name: Run prospective result collector tests
        run: python -m unittest discover -s tests -p 'test_prospective_result_collector.py' -v
      - name: Run historical result availability ledger tests
        run: python -m unittest discover -s tests -p 'test_result_availability_ledger.py' -v
      - name: Run provider settlement timestamp evidence tests
        run: python -m unittest discover -s tests -p 'test_provider_settlement_evidence.py' -v
      - name: Run qualified external settlement timestamp source tests
        run: python -m unittest discover -s tests -p 'test_settlement_timestamp_source.py' -v
      - name: Run acquisition-to-dataset bridge tests
        run: python -m unittest discover -s tests -p 'test_provider_acquisition_dataset_bridge.py' -v
      - name: Run canonical source payload provenance tests
        run: python -m unittest discover -s tests -p 'test_source_payload_provenance.py' -v
      - name: Run encrypted source evidence sidecar tests
        run: python -m unittest discover -s tests -p 'test_encrypted_source_evidence.py' -v
      - name: Compile encrypted evidence CLI verifier
        run: python -m py_compile scripts/verify_encrypted_source_evidence.py
      - name: Run historical feature reconstruction tests
        run: python -m unittest discover -s tests -p 'test_results_feature_reconstruction.py' -v
      - name: Run chronological dataset adapter tests
        run: python -m unittest discover -s tests -p 'test_results_training_dataset_adapter.py' -v
      - name: Run dataset-bound model training tests
        run: python -m unittest discover -s tests -p 'test_dataset_bound_market_training.py' -v
      - name: Run validation-only market calibration tests
        run: python -m unittest discover -s tests -p 'test_market_probability_calibration.py' -v
      - name: Run held-out test evaluation tests
        run: python -m unittest discover -s tests -p 'test_heldout_market_evaluation.py' -v
      - name: Run multi-origin walk-forward evaluation tests
        run: python -m unittest discover -s tests -p 'test_multi_origin_walk_forward.py' -v
