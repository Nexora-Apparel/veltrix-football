name: Test Independent Market Model Rebuild

on:
  push:
    branches:
      - rebuild/independent-market-models
  pull_request:
    branches:
      - phase-3/budget-aware-acquisition-contract

permissions:
  contents: read

jobs:
  independent-market-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install provider adapter import dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi
      - name: Run Poisson and Dixon-Coles model tests
        run: python -m pytest -q tests/test_poisson_dc_head.py tests/test_poisson_dixon_coles_model.py
      - name: Run independent market model tests
        run: python -m unittest discover -s tests -p 'test_independent_market_models.py' -v
      - name: Run independent fixture inference service tests
        run: python -m unittest discover -s tests -p 'test_independent_prediction_service.py' -v
      - name: Run independent report publication contract tests
        run: python -m unittest discover -s tests -p 'test_independent_report_contract.py' -v
      - name: Run legacy prediction quarantine tests
        run: python -m unittest discover -s tests -p 'test_legacy_prediction_quarantine.py' -v
      - name: Run Telegram and dashboard legacy-report suppression tests
        run: |
          python -m unittest discover -s tests -p 'test_telegram_commands.py' -v
          python -m pytest -q tests/test_dashboard_routing.py
      - name: Run raw source evidence archive tests
        run: python -m unittest discover -s tests -p 'test_provider_source_evidence.py' -v
      - name: Run provider fixture normalization and batch tests
        run: |
          python -m unittest discover -s tests -p 'test_provider_fixture_normalizer.py' -v
          python -m unittest discover -s tests -p 'test_provider_fixture_batch.py' -v
      - name: Run acquisition adapter and artifact integrity tests
        run: |
          python -m unittest discover -s tests -p 'test_provider_acquisition_adapters.py' -v
          python -m unittest discover -s tests -p 'test_provider_acquisition_artifact.py' -v
      - name: Run chronological Elo feature tests
        run: python -m unittest discover -s tests -p 'test_chronological_elo_features.py' -v
      - name: Run prospective result collector tests
        run: python -m unittest discover -s tests -p 'test_prospective_result_collector.py' -v
      - name: Run historical result availability ledger tests
        run: python -m unittest discover -s tests -p 'test_result_availability_ledger.py' -v
      - name: Run provider settlement timestamp evidence tests
        run: python -m unittest discover -s tests -p 'test_provider_settlement_evidence.py' -v
      - name: Run qualified external settlement timestamp source tests
        run: python -m unittest discover -s tests -p 'test_settlement_timestamp_source.py' -v
      - name: Run signed settlement source qualification registry tests
        run: python -m unittest discover -s tests -p 'test_source_qualification_registry.py' -v
      - name: Run signed feature source qualification registry tests
        run: python -m unittest discover -s tests -p 'test_feature_source_qualification.py' -v
      - name: Run point-in-time feature source contract tests
        run: python -m unittest discover -s tests -p 'test_point_in_time_feature_contract.py' -v
      - name: Run canonical season crosswalk tests
        run: python -m unittest discover -s tests -p 'test_canonical_season_crosswalk.py' -v
      - name: Run acquisition-to-dataset bridge tests
        run: python -m unittest discover -s tests -p 'test_provider_acquisition_dataset_bridge.py' -v
      - name: Run per-record acquisition eligibility audit tests
        run: python -m unittest discover -s tests -p 'test_provider_acquisition_eligibility_audit.py' -v
      - name: Run canonical source payload provenance tests
        run: python -m unittest discover -s tests -p 'test_source_payload_provenance.py' -v
      - name: Run historical feature reconstruction tests
        run: python -m unittest discover -s tests -p 'test_results_feature_reconstruction.py' -v
      - name: Run chronological dataset adapter tests
        run: python -m unittest discover -s tests -p 'test_results_training_dataset_adapter.py' -v
      - name: Run dataset-bound model training tests
        run: python -m unittest discover -s tests -p 'test_dataset_bound_market_training.py' -v
      - name: Run validation-only market calibration tests
        run: python -m unittest discover -s tests -p 'test_market_probability_calibration.py' -v
      - name: Run held-out test evaluation tests
        run: python -m unittest discover -s tests -p 'test_heldout_market_evaluation.py' -v
      - name: Run multi-origin walk-forward evaluation tests
        run: python -m unittest discover -s tests -p 'test_multi_origin_walk_forward.py' -v
      - name: Run fail-closed market release certification tests
        run: python -m unittest discover -s tests -p 'test_market_release_certification.py' -v
      - name: Run walk-forward certification evidence adapter tests
        run: python -m unittest discover -s tests -p 'test_walk_forward_certification_adapter.py' -v
      - name: Run prospective paper value selection ledger tests
        run: python -m unittest discover -s tests -p 'test_prospective_value_selection_ledger.py' -v
      - name: Run integrated offline market certification runner tests
        run: python -m unittest discover -s tests -p 'test_market_release_certification_runner.py' -v
      - name: Run signed multi-batch evidence registry merge tests
        run: python -m unittest discover -s tests -p 'test_verified_digest_registry_merge.py' -v
      - name: Run point-in-time bookmaker odds evidence tests
        run: python -m unittest discover -s tests -p 'test_bookmaker_odds_evidence.py' -v
      - name: Run The Odds API evidence adapter tests
        run: python -m unittest discover -s tests -p 'test_the_odds_api_evidence_adapter.py' -v
      - name: Run exact-byte The Odds API evidence client tests
        run: python -m unittest discover -s tests -p 'test_the_odds_api_raw_evidence_client.py' -v
      - name: Run isolated team identity normalization tests
        run: python -m unittest discover -s tests -p 'test_team_name_normalization.py' -v
      - name: Run offline odds evidence ingestion tests
        run: python -m unittest discover -s tests -p 'test_offline_odds_evidence_ingest.py' -v

      - name: Run audited provider dataset pipeline tests
        run: python -m unittest discover -s tests -p 'test_provider_acquisition_dataset_pipeline.py' -v

      - name: Compile audited provider dataset CLI
        run: python -m py_compile scripts/assemble_audited_provider_dataset.py

      - name: Run historical dataset admission profile tests
        run: python -m unittest discover -s tests -p 'test_historical_dataset_admission_report.py' -v

      - name: Run signed canonical team crosswalk tests
        run: python -m unittest discover -s tests -p 'test_canonical_team_crosswalk.py' -v

      - name: Run signed canonical season crosswalk tests
        run: python -m unittest discover -s tests -p 'test_canonical_season_crosswalk.py' -v

      - name: Run historical source coverage qualification tests
        run: python -m unittest discover -s tests -p 'test_historical_source_coverage.py' -v
