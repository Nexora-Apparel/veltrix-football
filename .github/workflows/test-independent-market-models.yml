name: Test Independent Market Model Rebuild

on:
  push:
    branches:
      - rebuild/independent-market-models
  pull_request:
    branches:
      - phase-3/budget-aware-acquisition-contract

permissions:
  contents: read

jobs:
  independent-market-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent market model tests
        run: python -m unittest discover -s tests -p 'test_independent_market_models.py' -v
      - name: Run historical feature reconstruction tests
        run: python -m unittest discover -s tests -p 'test_results_feature_reconstruction.py' -v
      - name: Run chronological dataset adapter tests
        run: python -m unittest discover -s tests -p 'test_results_training_dataset_adapter.py' -v
      - name: Run dataset-bound model training tests
        run: python -m unittest discover -s tests -p 'test_dataset_bound_market_training.py' -v
      - name: Run validation-only market calibration tests
        run: python -m unittest discover -s tests -p 'test_market_probability_calibration.py' -v
      - name: Run held-out test evaluation tests
        run: python -m unittest discover -s tests -p 'test_heldout_market_evaluation.py' -v
