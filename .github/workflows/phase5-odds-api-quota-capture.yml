name: VELTRIX Phase 5 — The Odds API no-credit account verification

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - ".github/workflows/phase5-odds-api-quota-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-odds-api-quota-capture
  cancel-in-progress: false

jobs:
  account-probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[odds-account-probe]')
    name: No-credit account scope and quota evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout VELTRIX integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/v2-report-bundle-wiring-20261114
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and PostgreSQL client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "psycopg[binary]>=3.2,<4"
      - name: Validate dry-run mode
        run: python -m scripts.phase5_capture_odds_api_quota --persist-staging
      - name: Capture no-credit account and sport-entitlement evidence
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -m scripts.phase5_capture_odds_api_quota --execute --persist-staging
