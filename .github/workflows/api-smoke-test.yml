name: API-Football primary API smoke test

on:
  push:
    branches: [main]
    paths:
      - "app/config.py"
      - "app/api_football_odds.py"
      - "app/cli.py"
      - "app/recent_results.py"
      - "scripts/run_daily_predictions.py"
      - "tests/test_football_api_odds.py"
      - "tests/test_api_football_odds.py"
      - "tests/test_recent_results.py"
      - ".github/workflows/api-smoke-test.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * 1"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run local sanity tests
        run: python -m pytest -q

      - name: Verify primary API-Football authentication and fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::error::Repository secret API_FOOTBALL_KEY is not configured."
            exit 1
          fi
          python -m app.cli status
          TODAY="$(TZ=Africa/Lagos date +%F)"
          python -m app.cli fixtures --date "$TODAY" --timezone Africa/Lagos
          END_DATE="$(TZ=Africa/Lagos date -d 'yesterday' +%F)"
          python -m app.cli history --from "$END_DATE" --to "$END_DATE" --output /tmp/veltrix-api-football-history-smoke.csv

      - name: Check API-Football prematch odds (scheduled/manual runs only)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::warning::Repository secret API_FOOTBALL_KEY is not configured; odds check skipped."
            exit 0
          fi
          TODAY="$(TZ=Africa/Lagos date +%F)"
          python -m app.cli odds --date "$TODAY" --timezone Africa/Lagos
