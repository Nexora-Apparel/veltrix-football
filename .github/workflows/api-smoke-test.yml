name: Multi-Source Provider Verification

on:
  push:
    branches: [main]
    paths:
      - "app/provider_adapters.py"
      - "scripts/verify_data_providers.py"
      - "scripts/verify_multi_source_integration.py"
      - "tests/test_provider_adapters.py"
      - ".github/workflows/api-smoke-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/provider_adapters.py"
      - "scripts/verify_data_providers.py"
      - "scripts/verify_multi_source_integration.py"
      - "tests/test_provider_adapters.py"
      - ".github/workflows/api-smoke-test.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * 1"

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Verify provider authentication (no odds quota used)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-provider-integration]'))
        env:
          FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/verify_data_providers.py

      - name: Verify live fixture and market integration (bounded requests)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-provider-integration]'))
        env:
          FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          PYTHONPATH: .
        run: python scripts/verify_multi_source_integration.py
