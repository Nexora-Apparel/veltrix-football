name: VELTRIX — One-Event Odds API Probe (3-credit cap)

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - ".github/workflows/phase5-odds-api-one-event-probe.yml"
      - "scripts/phase4_odds_one_event_probe.py"
      - "tests/scripts/test_phase4_odds_one_event_probe.py"
      - "veltrix_v2/providers/odds_api_v4/parser.py"
      - "veltrix_v2/data/postgres.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-odds-api-one-event-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[odds-one-event]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/v2-report-bundle-wiring-20261114

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "psycopg[binary]>=3.2,<4"

      - name: Compile and test one-event probe contracts
        run: |
          python -m compileall -q scripts/phase4_odds_one_event_probe.py tests/scripts/test_phase4_odds_one_event_probe.py
          python -m pytest --import-mode=importlib -q tests/scripts/test_phase4_odds_one_event_probe.py tests/providers/odds_api_v4/test_parser.py

      - name: Verify dry-run is non-operative
        run: |
          python -m scripts.phase4_odds_one_event_probe > /tmp/odds-probe-dry-run.json
          python -c 'import json; d=json.load(open("/tmp/odds-probe-dry-run.json")); assert d["mode"] == "DRY_RUN" and d["would_call_odds_endpoint"] is False and d["would_write_database"] is False and d["max_credits"] == 3 and d["max_credit_requests"] == 1 and len(d["approved_sport_keys"]) == 5'

      - name: Execute one-event probe (maximum one request / three credits)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
        run: |
          mkdir -p artifacts/odds-one-event-probe
          python -m scripts.phase4_odds_one_event_probe --execute > artifacts/odds-one-event-probe/summary.json
          python - <<'PY'
          import json
          p = "artifacts/odds-one-event-probe/summary.json"
          d = json.load(open(p, encoding="utf-8"))
          allowed = {
              "PASS_ONE_EVENT_ODDS_CAPTURE",
              "PASS_CAPTURE_NO_TIMESTAMPED_QUOTES",
              "BLOCKED_FRESH_QUOTA_PREFLIGHT",
              "BLOCKED_NO_UPCOMING_EPL_V2_FORECAST_FIXTURES",
              "BLOCKED_AMBIGUOUS_EXACT_EVENT_CROSSWALK",
              "BLOCKED_EVENT_DISCOVERY_QUOTA_MISMATCH",
              "BLOCKED_NO_UNAMBIGUOUS_EXACT_EVENT_MATCH",
              "BLOCKED_PREFLIGHT",
          }
          assert d.get("status") in allowed, d.get("status")
          assert d.get("odds_request_dispatched") is not False or d.get("actual_credits", 0) == 0
          if d.get("odds_request_dispatched"):
              assert d.get("actual_credits", 0) <= 3
          PY

      - name: Upload non-price capture summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-odds-api-one-event-probe-${{ github.run_id }}
          path: artifacts/odds-one-event-probe/summary.json
          if-no-files-found: warn
          retention-days: 30
