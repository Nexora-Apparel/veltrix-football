name: Women's History Coverage Audit

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to import (YYYY-MM-DD)"
        required: false
        default: "2011-01-01"
        type: string
      end_date:
        description: "Last date to import (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit-womens-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import category-isolated women's club history
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -z "$END_DATE" ]; then END_DATE="$(date -u +%F)"; fi
          python scripts/import_womens_club_history.py --from "$START_DATE" --to "$END_DATE" --output data/womens_club_historical_matches.csv
      - name: Audit imported dataset
        run: |
          python scripts/audit_historical_csv.py --input data/womens_club_historical_matches.csv --json-output reports/womens_history_audit.json --markdown-output reports/womens_history_audit.md
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          path = Path("data/womens_club_historical_matches.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          if not rows:
              raise SystemExit("No completed women's club matches were imported; refusing to publish an empty audit as success.")
          if any(row.get("category") != "WOMENS_CLUB" for row in rows):
              raise SystemExit("Category isolation check failed.")
          if any(not row.get("home_team_id") or not row.get("away_team_id") for row in rows):
              raise SystemExit("Source team IDs are missing.")
          print(f"Validated {len(rows)} rows; seasons={len({row['season'] for row in rows})}; divisions={dict(Counter(row['division'] for row in rows))}")
          PY
      - name: Upload women's history coverage audit
        uses: actions/upload-artifact@v7
        with:
          name: veltrix-womens-history-coverage-audit
          path: |
            data/womens_club_historical_matches.csv
            reports/womens_history_audit.json
            reports/womens_history_audit.md
          if-no-files-found: error
          retention-days: 90
