name: Vercel Preview Runtime Publication Smoke

on:
  push:
    branches: [integration/v2-report-bundle-wiring-20261114]
    paths:
      - ".github/workflows/vercel-preview-runtime-publication-smoke.yml"

permissions:
  contents: read

jobs:
  publication-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the branch preview and probe the deployed API
        env:
          PREVIEW_URL: https://veltrix-football-commands-git-integration-6168a8-nexora-apparel.vercel.app
        run: |
          set -euo pipefail
          response="$(mktemp)"
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --location --max-time 15 \
              --output "$response" --write-out '%{http_code}' \
              "$PREVIEW_URL/api/dashboard-data" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "${code:-}" = "200"
          python - "$response" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert isinstance(payload, dict), "dashboard API must return a JSON object"
          assert payload.get("status") == "UNAVAILABLE", payload
          assert payload.get("predictions") == [], payload
          print("DEPLOYED_RUNTIME_FAIL_CLOSED_OK")
          PY
