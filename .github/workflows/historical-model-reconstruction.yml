name: Historical Model Reconstruction

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: veltrix-historical-model-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct-october-25:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archived 25 October prediction report
        uses: actions/download-artifact@v7
        with:
          name: veltrix-daily-predictions
          path: reports/archive
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40175707059

      - name: Retrieve saved completed-results cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reports
          git fetch origin command-data --depth=1
          git show origin/command-data:public-data/recent_results_cache.json > reports/recent_results_cache.json
          test -s reports/recent_results_cache.json

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run historical reconstruction and common-fixture comparison
        run: |
          python -m pytest -q tests/test_historical_model_audit.py
          python scripts/audit_historical_model.py \
            --report reports/archive/daily_predictions.json \
            --cache reports/recent_results_cache.json \
            --output reports/historical_model_audit.json

      - name: Upload reconstructed audit
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-historical-model-audit
          path: reports/historical_model_audit.json
          retention-days: 90
