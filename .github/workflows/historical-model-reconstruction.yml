name: Historical Model Reconstruction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-model-reconstruction.yml"
      - "scripts/audit_historical_model.py"
      - "tests/test_historical_model_audit.py"
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: veltrix-historical-model-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct-archived-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download 24 October morning report (API-Sports-era sample)
        uses: actions/download-artifact@v7
        with:
          path: reports/archive/2026-10-24-morning
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40091657947

      - name: Download 24 October evening report
        uses: actions/download-artifact@v7
        with:
          path: reports/archive/2026-10-24-evening
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40121951981

      - name: Download 25 October midnight report (football-data.org migration attempt)
        uses: actions/download-artifact@v7
        with:
          path: reports/archive/2026-10-25-midnight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40144236021

      - name: Download 25 October morning report (Highlightly quota-limited run)
        uses: actions/download-artifact@v7
        with:
          path: reports/archive/2026-10-25-morning
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40175707059

      - name: Retrieve saved completed-results cache
        run: |
          set -euo pipefail
          mkdir -p reports
          git fetch origin command-data:refs/remotes/origin/command-data --depth=1
          git show origin/command-data:public-data/recent_results_cache.json > reports/recent_results_cache.json
          test -s reports/recent_results_cache.json

      - name: Install audit test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run audit unit tests
        run: python -m pytest -q tests/test_historical_model_audit.py

      - name: Reconstruct each archived prediction sample
        run: |
          set -euo pipefail
          for sample in 2026-10-24-morning 2026-10-24-evening 2026-10-25-midnight 2026-10-25-morning; do
            REPORT="reports/archive/$sample/daily_predictions.json"
            if [ ! -s "$REPORT" ]; then
              echo "::warning::Archived report missing for $sample; skipping."
              continue
            fi
            python scripts/audit_historical_model.py \
              --report "$REPORT" \
              --cache reports/recent_results_cache.json \
              --output "reports/audits/$sample.json"
          done
          test -n "$(find reports/audits -maxdepth 1 -name '*.json' -print -quit)"

      - name: Upload reconstructed comparison bundle
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-historical-model-audits
          path: reports/audits/*.json
          retention-days: 90
