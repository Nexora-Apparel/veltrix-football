name: Historical Model Reconstruction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-model-reconstruction.yml"
      - "scripts/audit_historical_model.py"
      - "tests/test_historical_model_audit.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: veltrix-historical-model-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct-archived-reports:
    # PAUSED: this job reconstructs forecasts from the excluded legacy model stack.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact archived report artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          download_report() {
            local artifact_id="$1"
            local sample="$2"
            local zip="reports/${sample}.zip"
            local destination="reports/archive/${sample}"
            mkdir -p "$destination"
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "$zip"
            unzip -oq "$zip" -d "$destination"
            test -s "$destination/daily_predictions.json"
            echo "Recovered $sample from artifact $artifact_id"
          }
          download_report 12558709744 2026-10-24-1153
          download_report 12569804955 2026-10-24-1821
          download_report 12571259034 2026-10-24-1843
          download_report 12579952962 2026-10-25-0049
          download_report 12591918825 2026-10-25-0813

      - name: Retrieve saved completed-results cache
        run: |
          set -euo pipefail
          mkdir -p reports
          git fetch origin command-data:refs/remotes/origin/command-data --depth=1
          git show origin/command-data:public-data/recent_results_cache.json > reports/recent_results_cache.json
          test -s reports/recent_results_cache.json

      - name: Install audit test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run audit unit tests
        run: python -m pytest -q tests/test_historical_model_audit.py

      - name: Reconstruct each archived prediction sample
        run: |
          set -euo pipefail
          for sample in 2026-10-24-1153 2026-10-24-1821 2026-10-24-1843 2026-10-25-0049 2026-10-25-0813; do
            REPORT="reports/archive/$sample/daily_predictions.json"
            python scripts/audit_historical_model.py \
              --report "$REPORT" \
              --cache reports/recent_results_cache.json \
              --output "reports/audits/$sample.json"
          done
          test "$(find reports/audits -maxdepth 1 -name '*.json' | wc -l)" -eq 5

      - name: Upload reconstructed comparison bundle
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-historical-model-audits
          path: reports/audits/*.json
          retention-days: 90
