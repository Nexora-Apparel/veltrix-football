name: Compare 5DollarFootballAPI Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: veltrix-5dollar-community-comparison
      cancel-in-progress: false
    env:
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
      FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe both credentials independently
        run: python scripts/compare_5dollar_credentials.py
