name: VELTRIX Phase 5 — Manual 5Dollar Shadow Settlement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-5dollar-shadow-settlement
  cancel-in-progress: false

jobs:
  settle:
    name: Bounded staging-only prospective settlement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout VELTRIX integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/v2-report-bundle-wiring-20261114

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and PostgreSQL client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "psycopg[binary]>=3.2,<4"

      - name: Validate dry-run mode
        run: |
          python -m scripts.phase5_settle_5dollar_shadow > /tmp/veltrix-settlement-dry-run.json
          python -c 'import json; d=json.load(open("/tmp/veltrix-settlement-dry-run.json")); assert d["mode"] == "DRY_RUN" and d["would_connect_to_database"] is False and d["would_call_provider"] is False and d["would_write_database"] is False and d["settlement"] is False'

      - name: Execute bounded prospective settlement
        env:
          FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
          VELTRIX_STAGING_DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -m scripts.phase5_settle_5dollar_shadow \
            --execute \
            --out artifacts/v2-settlement

      - name: Upload aggregate-only settlement scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-5dollar-settlement-${{ github.run_id }}
          path: artifacts/v2-settlement/settlement_public_summary.json
          if-no-files-found: warn
          retention-days: 7
