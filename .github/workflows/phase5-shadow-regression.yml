name: VELTRIX Phase 5 Shadow Regression

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - "scripts/phase5_collect_5dollar_shadow.py"
      - "tests/scripts/test_phase5_collect_5dollar_shadow.py"
      - "veltrix_v2/data/provider_evidence_capture.py"
      - "tests/veltrix_v2/test_provider_evidence_capture.py"
      - ".github/workflows/phase5-shadow-regression.yml"
  pull_request:
    paths:
      - "scripts/phase5_collect_5dollar_shadow.py"
      - "tests/scripts/test_phase5_collect_5dollar_shadow.py"
      - ".github/workflows/phase5-shadow-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-shadow-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile capture and regression test
        run: |
          python -m compileall -q scripts/phase5_collect_5dollar_shadow.py
          python -m compileall -q tests/scripts/test_phase5_collect_5dollar_shadow.py
          python -m compileall -q veltrix_v2/data/provider_evidence_capture.py
          python -m compileall -q tests/veltrix_v2/test_provider_evidence_capture.py
      - name: Run focused regression
        run: python -m pytest --import-mode=importlib -q tests/scripts/test_phase5_collect_5dollar_shadow.py tests/veltrix_v2/test_provider_evidence_capture.py
