name: VELTRIX Neon Clone Writer Acceptance

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - "tests/providers/odds_api_v4/test_postgres_store_postgres.py"
      - ".github/workflows/neon-clone-writer-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-neon-clone-writer-acceptance
  cancel-in-progress: false

jobs:
  neon-clone-writer-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
      VELTRIX_EXPECTED_DATABASE: veltrix_football_staging
      VELTRIX_TEST_SCHEMA_MODE: "1"
      VELTRIX_REHEARSAL_HOST: ep-withered-haze-bcktsdqu.c-16.us-east-1.aws.neon.tech
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and PostgreSQL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "psycopg[binary]>=3.2,<4"
      - name: Pin the existing staging credential to the isolated rehearsal branch
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          source = os.environ["DATABASE_URL"]
          if not source:
              raise SystemExit("VELTRIX_STAGING_DATABASE_URL secret is unavailable")
          parsed = urlsplit(source)
          allowed = {
              "ep-ancient-block-bcb439pk.c-16.us-east-1.aws.neon.tech",
              "ep-ancient-block-bcb439pk-pooler.c-16.us-east-1.aws.neon.tech",
          }
          if parsed.hostname not in allowed:
              raise SystemExit("Refusing unexpected source DATABASE_URL host")
          if parsed.path.rstrip("/") != "/veltrix_football_staging":
              raise SystemExit("Refusing unexpected source database name")
          host = os.environ["VELTRIX_REHEARSAL_HOST"]
          netloc = parsed.netloc.rsplit("@", 1)[0] + "@" + host
          target = urlunsplit((parsed.scheme, netloc, parsed.path, parsed.query, parsed.fragment))
          check = urlsplit(target)
          if check.hostname != host or check.path.rstrip("/") != "/veltrix_football_staging":
              raise SystemExit("Rehearsal DATABASE_URL target validation failed")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"DATABASE_URL={target}\n")
          print(f"Verified isolated Neon rehearsal target: {host}/veltrix_football_staging")
          PY
      - name: Run production writer against isolated Neon schema
        run: |
          python -m pytest --import-mode=importlib -q \
            tests/providers/odds_api_v4/test_postgres_store_postgres.py
