name: Phase 2 — 5Dollar Historical Data Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-phase2-historical-dry-run
  cancel-in-progress: false

jobs:
  historical-data-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Phase 2 data foundation tests
        run: python -m pytest -q tests/test_phase2_data_foundation.py tests/test_db_migrations.py
      - name: Run one-year read-only historical qualification
        run: python scripts/phase2_fivedollar_history_dry_run.py --output reports/phase2/fivedollar-history-dry-run.json
      - name: Upload sanitized evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-phase2-historical-data-dry-run
          path: reports/phase2/fivedollar-history-dry-run.json
          if-no-files-found: warn
          retention-days: 30
