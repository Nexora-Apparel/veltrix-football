name: VELTRIX Stage 2 — CC0 historical archive snapshot packs

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - ".github/workflows/phase2-openfootball-pit-snapshot-pack.yml"
      - "scripts/veltrix_v2/collect_openfootball_pit_snapshots.py"
      - "veltrix_v2/providers/openfootball_archive/parser.py"
      - "scripts/veltrix_v2/verify_openfootball_pit_snapshot_pack.py"
      - "veltrix_v2/providers/football_data_cc0/parser.py"
      - "scripts/veltrix_v2/collect_football_data_cc0_snapshots.py"
      - "scripts/veltrix_v2/verify_football_data_cc0_snapshots.py"
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Hard maximum GitHub API/raw snapshot requests"
        required: true
        default: "500"
        type: string
      max_commits_per_source:
        description: "Maximum commit-history entries per source path"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: veltrix-stage2-openfootball-pit-snapshot-pack
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact VELTRIX branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile collector and run isolated tests
        run: |
          python -m compileall -q scripts/veltrix_v2/collect_openfootball_pit_snapshots.py scripts/veltrix_v2/verify_openfootball_pit_snapshot_pack.py scripts/veltrix_v2/collect_football_data_cc0_snapshots.py scripts/veltrix_v2/verify_football_data_cc0_snapshots.py veltrix_v2/providers/football_data_cc0
          python -m pytest --import-mode=importlib -q tests/veltrix_v2/test_openfootball_pit_snapshot_pack.py tests/providers/test_openfootball_archive.py tests/veltrix_v2/test_football_data_cc0_snapshots.py

      - name: Collect rights-scoped immutable source snapshots
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/veltrix_v2/collect_openfootball_pit_snapshots.py \
            --output-dir artifacts/openfootball-pit-snapshot-pack \
            --max-requests "${{ inputs.max_requests || '500' }}" \
            --max-commits-per-source "${{ inputs.max_commits_per_source || '100' }}"

      - name: Verify generated archive pack independently
        if: always() && steps.collect.outcome != 'skipped'
        run: python scripts/veltrix_v2/verify_openfootball_pit_snapshot_pack.py --input-dir artifacts/openfootball-pit-snapshot-pack

      - name: Upload source snapshots, observation versions and manifest
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-stage2-openfootball-pit-snapshot-pack
          path: artifacts/openfootball-pit-snapshot-pack/
          if-no-files-found: error
          retention-days: 90

      - name: Collect supplemental FootballData CC0 Brazil Serie B snapshots
        id: football_data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/veltrix_v2/collect_football_data_cc0_snapshots.py \
            --output-dir artifacts/football-data-cc0-snapshot-pack \
            --max-requests 100 --max-commits-per-source 100

      - name: Verify supplemental FootballData archive pack independently
        if: always() && steps.football_data.outcome != 'skipped'
        run: python scripts/veltrix_v2/verify_football_data_cc0_snapshots.py --input-dir artifacts/football-data-cc0-snapshot-pack

      - name: Upload supplemental Brazil Serie B source snapshots and observations
        if: always() && steps.football_data.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-stage2-footballdata-brazil-serieb-snapshot-pack
          path: artifacts/football-data-cc0-snapshot-pack/
          if-no-files-found: error
          retention-days: 90
