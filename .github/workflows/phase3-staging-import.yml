name: Phase 3 — Bounded 5Dollar Staging Import

on:
  workflow_dispatch:
    inputs:
      days:
        description: Historical window (1–365 days)
        required: true
        default: "365"
        type: string

permissions:
  contents: read

concurrency:
  group: veltrix-phase3-staging-import
  cancel-in-progress: false

jobs:
  staging-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIVEDOLLARFOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_API_KEY }}
      DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
      VELTRIX_EXPECTED_DATABASE: veltrix_football_staging
      VELTRIX_ENABLE_STAGING_IMPORT: "YES"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and PostgreSQL dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Compile and test data pipeline
        run: |
          python -m compileall -q veltrix_v2 scripts/phase3_import_fivedollar_history.py
          python -m pytest -q tests/test_db_migrations.py tests/test_phase2_data_foundation.py
      - name: Import bounded history into isolated staging database
        run: >-
          python scripts/phase3_import_fivedollar_history.py
          --days "${{ inputs.days }}"
          --output reports/phase3/staging-import.json
      - name: Upload sanitized staging import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-phase3-staging-import
          path: reports/phase3/staging-import.json
          if-no-files-found: warn
          retention-days: 90
