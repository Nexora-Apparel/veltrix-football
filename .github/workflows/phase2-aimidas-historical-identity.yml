name: Phase 2 — AI Midas historical identity reconciliation

on:
  push:
    branches:
      - integration/v2-report-bundle-wiring-20261114
    paths:
      - "scripts/veltrix_v2/collect_aimidas_snapshot.py"
      - "scripts/veltrix_v2/verify_aimidas_snapshot.py"
      - "scripts/veltrix_v2/import_aimidas_staging.py"
      - "scripts/veltrix_v2/reconcile_aimidas_historical_identity.py"
      - "tests/veltrix_v2/test_aimidas_historical_identity.py"
      - ".github/workflows/phase2-aimidas-historical-identity.yml"

permissions:
  contents: read

concurrency:
  group: veltrix-aimidas-historical-identity
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/integration/v2-report-bundle-wiring-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_STAGING_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Compile and run focused tests
        run: |
          python -m compileall -q scripts/veltrix_v2/reconcile_aimidas_historical_identity.py
          python -m pytest -q tests/veltrix_v2/test_aimidas_historical_identity.py tests/veltrix_v2/test_aimidas_snapshot.py tests/veltrix_v2/test_aimidas_staging_import.py
      - name: Fetch exact pinned source snapshots
        run: python scripts/veltrix_v2/collect_aimidas_snapshot.py --output-dir /tmp/veltrix-aimidas-pack
      - name: Independently verify source snapshots
        run: python scripts/veltrix_v2/verify_aimidas_snapshot.py --input-dir /tmp/veltrix-aimidas-pack
      - name: Reconcile six historical archives against staging registry (read-only)
        run: |
          python scripts/veltrix_v2/reconcile_aimidas_historical_identity.py \
            --input-dir /tmp/veltrix-aimidas-pack \
            --output /tmp/aimidas-historical-identity-detail.json \
            --summary-output reports/aimidas/historical-identity-summary.json
      - name: Upload sanitized reconciliation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-aimidas-historical-identity-summary
          path: reports/aimidas/historical-identity-summary.json
          if-no-files-found: warn
          retention-days: 30
