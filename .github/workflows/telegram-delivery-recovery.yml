name: VELTRIX V2 Telegram Delivery (LOCKED)

on:
  workflow_dispatch:
    inputs:
      bundle_path:
        description: "Relative path under command-data/public-data/bundles"
        required: true
        type: string
      enable_delivery:
        description: "Must remain false until release certification is complete"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: veltrix-v2-telegram-delivery
  cancel-in-progress: false

jobs:
  v2-telegram-delivery:
    # Deliberate release lock: do not remove until certification, rights and
    # production migration gates pass. There is no cron trigger in this workflow.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: command-data
          path: command-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]>=3.2,<4"
      - name: Dispatch the authorized portable report bundle
        env:
          VELTRIX_V2_TELEGRAM_DELIVERY_ENABLED: ${{ inputs.enable_delivery }}
          VELTRIX_V2_REPORT_BUNDLE_PATH: command-data/${{ inputs.bundle_path }}
          VELTRIX_V2_TELEGRAM_DATABASE_URL: ${{ secrets.VELTRIX_V2_TELEGRAM_DATABASE_URL }}
          VELTRIX_V2_TELEGRAM_EXPECTED_DATABASE: ${{ vars.VELTRIX_V2_TELEGRAM_EXPECTED_DATABASE }}
          VELTRIX_V2_TELEGRAM_EXPECTED_CHAT_ID: ${{ vars.VELTRIX_V2_TELEGRAM_EXPECTED_CHAT_ID }}
          VELTRIX_V2_PUBLICATION_VERIFIER_FACTORY: ${{ vars.VELTRIX_V2_PUBLICATION_VERIFIER_FACTORY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/veltrix_v2/dispatch_public_telegram_bundle.py
