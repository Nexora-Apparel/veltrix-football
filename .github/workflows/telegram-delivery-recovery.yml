name: Telegram Delivery Recovery

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veltrix-telegram-delivery-recovery
  cancel-in-progress: false

jobs:
  deliver-published-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out report sender
        uses: actions/checkout@v4

      - name: Download today's published report and paper ledger
        id: report
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p reports
          BASE="https://raw.githubusercontent.com/$GH_REPOSITORY/command-data/public-data"
          curl --fail --silent --show-error --max-time 20 "$BASE/daily_predictions.json" -o reports/daily_predictions.json
          curl --fail --silent --show-error --max-time 20 "$BASE/paper_tracking_ledger.json" -o reports/paper_tracking_ledger.json || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          report = json.loads(Path("reports/daily_predictions.json").read_text(encoding="utf-8"))
          today = datetime.now(ZoneInfo("Africa/Lagos")).date().isoformat()
          valid = (
              report.get("as_of_date") == today
              and report.get("command_data_publication") == "PUBLISHED"
              and report.get("same_day_only") is True
              and isinstance(report.get("predictions"), list)
          )
          print(f"valid={'true' if valid else 'false'}")
          print(f"report_date={report.get('as_of_date', 'missing')}")
          print(f"today={today}")
          if not valid:
              print("::notice::Published report is missing, stale, or structurally invalid; delivery skipped.", file=__import__("sys").stderr)
          PY

      - name: Send today's report if not already delivered
        if: steps.report.outputs.valid == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram credentials are not configured; published report remains available on command-data."
            exit 0
          fi
          python -m pip install --disable-pip-version-check requests
          python scripts/send_telegram_report.py --report reports/daily_predictions.json --ledger reports/paper_tracking_ledger.json

      - name: Report skipped stale snapshot
        if: steps.report.outputs.valid != 'true'
        run: echo "No current-day published report to deliver. No fixture-provider calls were made."
